n bid to get out of jail, but judge delays decision", "date": "Hearing August 27; republication August 28, 2026", "url": "https://www.wlrn.org/law-justice/2026-08-28/shackled-tate-brothers-testify-in-bid-to-get-out-of-jail-but-judge-delays-decision"}, {"outlet": "[30] U.S. Department of Justice", "title": "Justice Manual 9-15.700: Foreign Extradition and Provisional Arrest Requests", "date": "Current page accessed October 18, 2026", "url": "https://www.justice.gov/jm/jm-9-15000-international-extradition-and-related-matters"}, {"outlet": "[31] NPR / Michigan Public", "title": "Andrew and Tristan Tate arrested in Florida on charges of rape and sex trafficking", "date": "July 18, 2026; updated July 22", "url": "https://www.michiganpublic.org/2026-07-18/andrew-and-tristan-tate-arrested-in-florida-on-charges-of-rape-and-sex-trafficking"}, {"outlet": "[32] NPR / VPM", "title": "Andrew and Tristan Tate arrested in Florida on charges of rape and sex trafficking", "date": "July 19, 2026", "url": "https://www.vpm.org/npr-news/2026-07-19/andrew-and-tristan-tate-arrested-in-florida-on-charges-of-rape-and-sex-trafficking/"}, {"outlet": "[33] Associated Press", "title": "British court permits forfeiture of Tate brothers’ funds", "date": "December 18, 2024", "url": "https://apnews.com/article/03e966b3ed8764bf3b399f50e37634fd"}, {"outlet": "[34] Reuters / Investing.com", "title": "Internet personality Andrew Tate moved to house arrest after court ruling", "date": "March 31, 2023", "url": "https://www.investing.com/news/world-news/internet-personality-andrew-tate-to-be-moved-to-house-arrest-lawyer-says-3046737"}, {"outlet": "[35] Reuters / Investing.com", "title": "Romanian court releases influencer Andrew Tate from house arrest pending trial", "date": "August 4, 2023", "url": "https://www.investing.com/news/world-news/romanian-court-releases-influencer-andrew-tate-from-house-arrest-pending-trial-3144913"}, {"outlet": "[36] Associated Press", "title": "Andrew and Tristan Tate check in at police station in Romania, complying with judicial measures", "date": "March 24, 2025", "url": "https://apnews.com/article/c989d6cd1c8c5c4ee2f690e9cae4078d"}, {"outlet": "[37] Associated Press / KVIA", "title": "Andrew Tate placed under house arrest as new human trafficking allegations emerge involving minors", "date": "August 22, 2024", "url": "https://kvia.com/ap-national-news/2024/08/22/andrew-tate-placed-under-house-arrest-as-new-human-trafficking-allegations-emerge-involving-minors/"}, {"outlet": "[38] Associated Press", "title": "The Tate brothers must stay locked up during their UK extradition fight, US judge says", "date": "September 9, 2026", "url": "https://apnews.com/article/997cb8ceccefd959f301bd296d6d7ab8"}, {"outlet": "[39] YouGov", "title": "One in six boys aged 6–15 have a positive view of Andrew Tate", "date": "September 27, 2023", "url": "https://yougov.com/en-gb/articles/47419-one-in-six-boys-aged-6-15-have-a-positive-view-of-andrew-tate"}, {"outlet": "[40] Reuters Archive Licensing", "title": "Zero per cent chance of me being found guilty — Andrew Tate after being moved to house arrest", "date": "March 31, 2023", "url": "https://reuters.screenocean.com/record/1718097"}], "minutes": 13}, {"slug": "case-against-clavicular", "topic": "streets", "date": "2026-10-17", "title": "Clavicular Tries Not to Crash Out After Serious New Charges", "dek": "The looksmaxxing streamer is charged on Cape Cod with rape and drugging a 17-year-old. Here's the case, his denial, and the rap sheet that came before it.", "body": ["Braden Peters, 20, better known online as Clavicular, built a following as the face of 'looksmaxxing': trying to max out your looks by any means, including, by his own account, steroids, crystal meth to kill appetite, and 'bonesmashing,' hitting your own face with a hammer in the belief that tiny fractures sharpen the jaw. Doctors call that a terrible idea. Prosecutors in Massachusetts now say he did something far worse.", "Everything below is an allegation unless it says otherwise. Peters denies the Massachusetts charges and is presumed innocent.", "## The Massachusetts case", "On September 8, 2026, a criminal complaint was issued in Orleans District Court on Cape Cod charging Peters with three counts, after a judge found probable cause on September 4:", "= Rape | Felony", "= Drugging a person for sexual intercourse | Felony", "= Procuring liquor for a person under 21 | Misdemeanor", "The complaint stems from May 23, 2025, at his family's home in Chatham. According to the police report as described by the Boston Globe and CBS News, the complainant was 17 at the time. She went to Chatham police with a lawyer in June 2026. She alleges Peters gave her vodka during a livestream, told her to say she was 18 and to call the alcohol 'water' so his streaming accounts wouldn't get banned, and then had sex with her when she was too intoxicated to consent. Police wrote that they believed her level of intoxication left her unable to consent, and said Uber records confirmed his name and phone number. Police said they tried to reach Peters twice in late August without success.", "Peters was summonsed, not arrested, and is not in custody. Reports of the maximum sentence vary: the rape count carries up to 20 years, while the drugging statute carries up to life with a 10-year minimum. A felony trial would require an indictment in Superior Court, and none has been reported.", "## Where it stands", "His October 14 arraignment was canceled. Reporting conflicts on when he's due back. NBC said the next hearing 'appears' to be October 22, Boston 25 reported that date is a hearing in a Florida civil case, and Boston's 7News said the arraignment would be the following week. He has not entered a plea.", "> denies the claims and disputes the characterization of events (Peters' lawyer, via the Boston Globe)", "His spokesperson, Mitchell Jackson, called the charges 'bogus' and argued they grew out of a civil lawsuit Peters refused to settle. On X, Peters posted that people come for successful young men's money.", "## The civil suit", "The same woman, now 18, is suing him in Miami-Dade County for more than $100,000. The suit alleges he injected her, while she was a minor and on a livestream, with Aqualyx, a fat-dissolving product not approved by the FDA, and that she was left with a perforated cheek. In October her lawyer dropped the sexual-assault claim from the civil case, saying that matter belongs in criminal court.", "> this matter is more appropriate for the criminal justice system. (Drew Moss, the plaintiff's attorney)", "## The rap sheet so far", "= Arizona, Feb. 2026 · fake ID, pills without a prescription | Declined", "Arrested in Old Town Scottsdale. The Maricopa County Attorney's Office turned it down, citing no reasonable likelihood of conviction.", "= Florida, March 2026 · battery warrant, Osceola County | No charges", "Arrested in Fort Lauderdale on a warrant. The sheriff's office said Peters instigated a fight between two women at a rental he'd booked and posted it to exploit them. Prosecutors later said they couldn't prove it beyond a reasonable doubt.", "= Florida, May 2026 · firing a gun at an alligator in the Everglades | No contest", "He pleaded no contest to unlawfully discharging a firearm in public and got six months' probation, safety courses and 20 hours of community service that he isn't allowed to stream or monetize.", "= Massachusetts, Sept. 2026 · rape, drugging, liquor to a minor | Pending", "## The platforms", "YouTube terminated his original channel in November 2025 and two replacement channels in April 2026. Kick removed him after a December 2025 livestream that appeared to show a person on the windshield of his moving Cybertruck; gaming outlet Dexerto later called that ban temporary. In April 2026 he was hospitalized after passing out on a livestream, and afterward said he was swearing off drugs.", "## Why it matters", "His fans are young. Doctors quoted by NPR and Fox News warn that looksmaxxing can cause serious physical and mental-health damage, and that teenage boys are especially vulnerable. The president of the American Society of Plastic Surgeons said even minimally invasive treatments carry real risks in untrained hands.", "The Massachusetts case will be decided in a courtroom, not in a comment section. But the pattern of his public life is already on the record: arrests, a probation sentence, banned channels and a career built on telling kids to break their own faces."], "sources": [{"outlet": "CBS News", "title": "\"Looksmaxxing\" influencer Clavicular charged with rape in Massachusetts", "date": "Sep 22, 2026", "url": "https://www.cbsnews.com/news/clavicular-looksmaxxing-influencer-rape-charge-massachusetts/"}, {"outlet": "The Boston Globe", "title": "'Looksmaxxing' influencer Clavicular charged with rape on Cape Cod", "date": "Sep 22, 2026", "url": "https://www.bostonglobe.com/2026/09/22/metro/clavicular-looksmaxxing-rape-charge-cape/"}, {"outlet": "Fox News", "title": "Braden Peters charged in Massachusetts", "date": "Sep 2026", "url": "https://www.foxnews.com/us/looksmaxxing-influencer-clavicular-charged-teen-alleges-attack-familys-cape-cod-home"}, {"outlet": "IBTimes UK", "title": "Clavicular faces three criminal counts", "date": "Sep 22, 2026", "url": "https://www.ibtimes.co.uk/clavicular-faces-massachusetts-criminal-charges-1821126"}, {"outlet": "WomensLaw.org", "title": "M.G.L. c.272 §3, drugging persons for sexual intercourse", "date": "statute", "url": "https://womenslaw.org/laws/ma/statutes/ss-3-drugging-persons-sexual-intercourse"}, {"outlet": "NBC 6 South Florida", "title": "Clavicular's accuser drops sexual assault claims from civil lawsuit", "date": "Oct 13, 2026", "url": "https://www.nbcmiami.com/news/national-international/clavicular-accuser-drops-sexual-assault-claims-from-civil-lawsuit/3872537/"}, {"outlet": "Boston 25 News", "title": "Accuser drops sexual assault claims from civil lawsuit", "date": "Oct 13, 2026", "url": "https://www.boston25news.com/news/local/influencer-claviculars-accuser-drops-sexual-assault-charges-civil-lawsuit-amid-case-mass/GWWYCWVNLFE4XJRCISG6WPWP7A/"}, {"outlet": "WHDH 7News", "title": "Streamer to face criminal rape charge in Cape Cod court", "date": "Oct 14, 2026", "url": "https://whdh.com/news/sexual-assault-claims-against-clavicular-dropped-streamer-to-face-criminal-rape-charge-in-cape-cod-court-next-week/"}, {"outlet": "KTAR News", "title": "Clavicular won't be prosecuted after Scottsdale arrest", "date": "Feb 11, 2026", "url": "https://ktar.com/arizona-news/clavicular-scottsdale-case-dropped/5820592/"}, {"outlet": "NBC 6 South Florida", "title": "Clavicular arrested on battery charge in Fort Lauderdale", "date": "Mar 27, 2026", "url": "https://www.nbcmiami.com/news/local/influencer-clavicular-arrested-on-battery-charge-in-fort-lauderdale-records-show/3787112/"}, {"outlet": "WKMG News 6", "title": "No charges after Central Florida battery incident", "date": "Aug 3, 2026", "url": "https://www.clickorlando.com/news/local/2026/08/03/no-charges-for-social-media-star-clavicular-after-central-florida-battery-incident/"}, {"outlet": "CBS News Miami", "title": "Clavicular and \"Cuban Tarzan\" plead no contest", "date": "May 15, 2026", "url": "https://www.cbsnews.com/miami/news/clavicular-cuban-tarzan-plead-no-contest-everglades-alligator-shooting-case/"}, {"outlet": "Rolling Stone Canada", "title": "Clavicular's YouTube channels terminated again", "date": "Apr 24, 2026", "url": "https://ca.rollingstone.com/clavicular-youtube-channels-removed-again/"}, {"outlet": "Dexerto", "title": "Charges against Clavicular reportedly dropped", "date": "Feb 9, 2026", "url": "https://www.dexerto.com/kick/how-much-jail-time-is-clavicular-facing-after-arizona-arrest-charges-explained-3316320/"}, {"outlet": "NPR via KVCR", "title": "Taking a look at looksmaxxing", "date": "May 1, 2026", "url": "https://kvcr.org/news/npr-top-stories/2026-05-01/looksmaxxing-teen-boys-clavicular"}, {"outlet": "Fox News", "title": "Doctors warn looksmaxxing trend risks", "date": "Apr 17, 2026", "url": "https://www.foxnews.com/health/doctors-warn-looksmaxxing-dangers-influencers-livestream-emergency"}], "minutes": 4}, {"slug": "candace-anomalies", "topic": "politics", "date": "2026-10-18", "title": "Candace Owens vs. TPUSA: The Fight Over Who Killed Charlie Kirk", "dek": "Egyptian jets, French legionnaires, an exploding microphone: Candace Owens has built a shadow investigation into Charlie Kirk’s killing. The case does contain real security failures and real forensic limits. Here is where the evidence stops and the speculation takes over.", "body": ["## Twelve Twenty-Three", "Approximately 12:23:28 p.m. September 10, 2025. Utah Valley University, Orem. Charlie Kirk is answering a question when a bullet strikes him. Prosecutors fixed that second in their July 28, 2026, reconstruction of the killing. It ties the gunshot to surveillance of a figure rising from a prone position on the roof of the Losee Building. That is the state’s account, built on exhibits cited in its filing. No jury has ruled on it. [1]", "Candace Owens has spent the months since building a different story. Egyptian aircraft. Israeli pressure. French military training. Suspect phone calls. An alleged meeting at an Army installation. A microphone that might have been a weapon. To the former Turning Point USA colleague, Kirk’s death is a mystery whose answer lies somewhere beyond the young man prosecutors charged with killing him. [8,9,12,14,19]", "Some of the threads she has pulled are real. Kirk’s private complaints about donors were authentic, according to his organization’s spokesman. A university-commissioned security review documented serious planning failures. A firearms examiner could not identify a recovered bullet fragment to the suspected rifle. Those facts count, even when they muss up the tidy version of the case. [6,7,10]", "But they only carry so far. A security failure doesn’t name a conspirator. A donor fight isn’t a murder plot. An inconclusive test doesn’t clear a rifle. Owens’s trouble is how often, mid-episode, the distance between something odd and an accusation simply disappears.", "Start with the clock.", "FBI Director Kash Patel’s September 12 account put the shooting at 12:23 p.m. Mountain time and the first FBI agents on scene at 12:39. On September 11, the bureau released suspect photographs at 10 a.m., announced a $100,000 reward at 10:45, and put out more images and video around an 8 p.m. press conference. Patel said the suspect entered custody at 10 p.m. That is as precise as the FBI got. Anyone adding seconds is making them up. [2]", "UVU Officer Christopher Bagley gave another time under questioning: he reached the Losee rooftop at approximately 12:44 p.m. He described a red-and-black screwdriver lying in the gravel roughly 10 to 15 feet beyond a guardrail, which he said he did not touch. A named witness, a physical object, a sequence you can check against the exhibits. That beats squinting at a distant figure’s movements and guessing. [31]", "Tyler James Robinson was 22 when he was arrested. On September 16, Utah County Attorney Jeffrey Gray filed seven charges: aggravated murder, a firearms offense, two counts of obstruction, two counts of witness tampering and an offense involving violence in a child’s presence. Prosecutors sought the death penalty. After five days of preliminary-hearing evidence, July 6–10, 2026, Judge Tony Graf ruled on September 1 that Robinson would stand trial. Robinson, by then 23, pleaded not guilty. [1,3,4]", "The next hearing was set for October 23 at 1 p.m.; no trial date was fixed at the September proceeding. And keep the stakes straight. A preliminary hearing tests only probable cause, a far lower bar than proof beyond a reasonable doubt. The defense does not have to solve the killing or hand the jury another suspect. [5]", "## What the State Says It Has", "The prosecution’s case braids together different kinds of evidence. Its July memorandum describes DNA results supporting Robinson’s contribution to samples from the rifle, the fired cartridge case, a wrapping towel and the rooftop screwdriver. Investigators also stitched together campus movements from surveillance and identified a return near Campus Drive at approximately 12:36 a.m. on September 11. All of that is the prosecution’s version, and the defense can go after every piece: who is on the footage, how the samples were collected, what they actually mean. [1]", "The September charging document describes a note and messages handed over by Robinson’s roommate, later publicly identified as Lance Twiggs. Prosecutors attribute to Robinson messages acknowledging the shooting, discussing retrieval of a hidden rifle, fretting about its connection to his family and telling Twiggs to delete their exchanges. That is a long way from police saying trust us, we got the right guy. The defense can still fight over whether the messages are genuine and what they mean. [3]", "In episode 237, Owens suggested the messages had been manufactured, pointing to Discord’s denial and missing timestamps. The charging document identifies the roommate exchange as texts. Missing timestamps in a public excerpt are a good reason to demand the underlying records. They are not proof of fabrication. The real questions are how the texts were pulled, who sent them and whether anything is missing. A hunch that a smart suspect would never write something so damning tells you nothing about whether he did. [3,33]", "Her campus claim was just as absolute. In episode 255, listed October 30, 2025, Owens said Robinson had not been on campus at all. By episode 393, she was talking about the “real Tyler” being around campus while proposing a different role for him. That is a big swerve. Whether he was near campus, whether he is the man in the pictures and whether he pulled the trigger are three separate questions. When a theory changes, the honest move is to say so, not to act as if it was the theory all along. [26,21]", "Fair is fair, and a correction is owed here, too. Reporting on the July hearing described a videotaped interview in which Twiggs recounted Robinson expressing regret. That is a recording of the roommate’s account, not necessarily a recording of Robinson saying anything. The interview also knocks down the sweeping suggestion that investigators never questioned Twiggs. If we are going to demand precision from Owens, we owe the same precision describing the evidence she’s up against. [28]", "The bullet is where the state’s case shows a genuine soft spot. On July 9, ATF examiner Samantha Karner testified that the recovered jacket fragment could neither be identified nor excluded as having been fired through the submitted rifle. Its microscopic markings showed neither sufficient agreement nor sufficient disagreement. At playback time 07:48:44 in the published hearing transcript, she said there was no further testing she herself could perform. That number is a recording timestamp, not 7:48 a.m. [6]", "The same hearing dealt with a different object: the fired cartridge case recovered from the rifle. An ATF report identified that case as having been fired in the weapon. Identifying a cartridge case and comparing a bullet fragment answer different questions, and neither result should be quietly swapped in for the other. [6]", "Owens had every right to hammer the inconclusive result. Calling it a mismatch goes too far. So does calling it a match, which hands prosecutors evidence they never got. PolitiFact laid out that distinction on April 2, after a defense filing set off claims that the ballistics had cleared Robinson. [29]", "## A Courtyard Built for 600", "The bigger failure is less exotic, and far better documented.", "UVU’s external review, released September 25, 2026, describes an event that outgrew its own planning. An August 21 questionnaire projected 600 attendees. By August 25, university staff were discussing the headaches of an outdoor courtyard event, including crowds and access, and floating alternatives. The event stayed in the courtyard. [7]", "The review found no comprehensive written security assessment and no event action plan. Elevated positions and building access were never formally folded into such a plan. Turning Point flagged concerns about the Hall of Flags elevated walkway on September 8, and again on the morning of September 10. A joint security meeting planned for 11 a.m. never happened. The review faulted both university police and Turning Point security for failing to complete a joint briefing and walkthrough. [7]", "The university commissioned the review, and its conclusion that UVU did not act in bad faith or with willful or wanton disregard is the reviewers’ judgment, not a court’s. Either way, the planning failures are serious. [7]", "Others besides Owens were chasing the question of responsibility. Reuters reported on September 16 that Kirk’s family had given notice of a planned wrongful-death action against the university and Utah. That notice alleges security failures; no verdict has established them. But it shows the bullet fragment is not the only legitimate open question. [30]", "## Wheels Up, Six Hours Off", "The Egyptian plane is the cleanest example of what happens when a timestamp hardens into a theory before anyone checks the time zone.", "On October 11, 2025, Owens spotlighted an Egyptian Air Force aircraft, registration SU-BTT, leaving Provo at 13:08, and treated it as a departure after the shooting. The time was UTC. Utah was on Mountain Daylight Time, six hours behind. 13:08 UTC was 7:08 a.m. local, more than five hours before Kirk was shot. Owens later acknowledged the correction while maintaining that the aircraft’s presence was abnormal. [8,26]", "That fixed one claim, not every aircraft allegation that followed. In episode 266, listed November 18, she discussed SU-BTT and SU-BND, credited an unnamed researcher and described 68 apparent overlaps with Erika Kirk’s locations, a tally that grew to 73 with more searching. Twenty-nine supposedly involved Charlie as well. Those were Owens’s counts and Owens’s interpretation, not independently established instances of surveillance. [9]", "A list of overlapping locations needs a defined radius, a time window, complete travel histories and a baseline for ordinary traffic. It needs evidence of who was aboard and why. Even perfectly recorded flight movements cannot, on their own, show that the people inside were tracking a particular person. Without all that, a spreadsheet is just a pile of coincidences.", "The Israel story starts on firmer ground, then takes a far bigger leap.", "In October 2025, Owens released Kirk’s private messages. Turning Point spokesman Andrew Kolvet confirmed they were authentic. Kirk complained that a Jewish donor had pulled $2 million a year because the organization would not cancel Tucker Carlson, and vented frustration over pressure from supporters of Israel. The messages document a fight over money and politics. They contain no demonstrated instruction to kill him. [10]", "How those messages got out is another story that tends to get flattened into certainty. On March 23, 2026, Kolvet said he had given screenshots to Joe Kent, then director of the National Counterterrorism Center. Kolvet said Kent later urged him to publish them, which he declined to do, and the material eventually surfaced publicly. But Kolvet pointedly stopped short of saying he could establish that Kent leaked it. That caveat is everything: knowing one person who had the screenshots does not tell you who handed them to Owens. Whether the messages are real and who leaked them are two different questions. [27]", "Owens also cast a Hamptons encounter involving investor Bill Ackman as threatening. Ackman denied that characterization. [11]", "On December 5, Patel told Megyn Kelly the FBI had no credible information linking a foreign government to the assassination and no credible reason to implicate Turning Point personnel. That was the bureau’s position on that date, not a promise that investigators hold every relevant fact. [13]", "In her August 14, 2026, debate with Andrew Wilson, Owens defended her suspicions about Israel and France while declining to lay out a definite account of who ordered what. Around 01:45 in the published transcript, she said they could not state with certainty that Israel called the shots. Later she defended her right to think the countries were involved. Over and over, opinion got offered up as if it answered a demand for evidence. [22]", "By then the French allegation had already swelled to extraordinary size. On November 22, 2025, Owens cited an unnamed source inside France’s government while alleging a plot against her own life. In the same account, she asserted that Kirk’s assassin had trained with the French Foreign Legion. A later post pointed to a real U.S.–French military exercise in California. [12]", "France’s armed forces ministry told Euronews that Robinson had never belonged to the Legion and could not have received the training described. The ministry also rejected a related Minnesota training claim. A denial from an implicated government is not independent proof of innocence. But evidence that an exercise took place establishes neither Robinson’s attendance nor any link to Kirk’s killing. Nothing verifiable puts him there. [12]", "## The People in the Gap", "Her suspicions about the people around Kirk cut closer, and they are often hard to untangle from judgments about how grieving, frightened people are supposed to behave.", "In her December 17, 2025, interview with Piers Morgan, she separated a suspected cover-up from proof of participation in murder. She said she had privately identified two people whose possible foreknowledge worried her, and declined to name them publicly. At approximately 26:44 in the published transcript, she explained: “Because I don’t have concrete evidence is the reason why I’m not naming them.” [14]", "> “Because I don’t have concrete evidence is the reason why I’m not naming them.”", "The interview also took up her claim that Michael “Mikey” McCoy raised a phone to his ear 0.834 seconds after the shot. That figure was Owens’s reading of a video interval, not an official finding. Morgan challenged the leap to foreknowledge. Owens said she had since seen call logs but remained suspicious. [14]", "The missing steps are not small: establishing the recording’s timing, identifying the action, determining whether a call was already underway, and showing why any of it points to advance knowledge. Three decimal places can make an accusation look measured without measuring the thing that matters.", "Erika Kirk’s public answer to Owens was blunt. Asked about her by CBS News, she said: “Stop.” [18]", "The alleged Fort Huachuca meeting shows what is at stake for the people who land in that gap.", "On December 18, 2025, Owens interviewed Mitchell “Mitch” Snow about his claimed sighting of a meeting at the Arizona Army installation the morning before Kirk’s death. His story implicated Kirk’s security chief, Brian Harpole, Erika Kirk and others. Harpole’s April 30, 2026, federal complaint says travel records place him in Dallas that morning and that he has never visited Fort Huachuca. It accuses Owens of continuing to promote the claim despite contrary information. Those are the plaintiff’s allegations. [15]", "Owens disputes any wrongdoing. In August, she moved to dismiss portions of the suit, arguing that the challenged statements included protected opinion, rhetorical hyperbole and questions. A court will sort that out. The lawsuit itself proves neither defamation nor a conspiracy. [16]", "Robert “Robby” Hild Jr. is another version of the same problem. In a federal complaint filed September 28, 2026, the Utah man alleges that Owens encouraged an identification of him as the person in FBI stairwell images. His complaint says video places him in the audience at approximately 11:52 a.m., around the time associated with the stairwell image. It describes efforts to get that material to Owens and alleges harassment that followed. [17]", "The complaint is one litigant’s presentation, not an alibi any court has tested. But its particulars, named witnesses, photographs, metadata and a stated chronology, can be checked. Looking like someone is a reason to check, not a license to tie a bystander to an assassination in front of millions. Hild’s claims get the same scrutiny as everyone else’s. [17]", "## Rewriting the Shot", "Some theories ask you to rewrite the shooting itself.", "In episode 350, listed June 17, 2026, Owens explored whether a concealed explosive in Kirk’s wireless microphone killed him. She cited an online researcher, photographs of apparent debris and comparisons with his earlier microphone setups. She also asked why dogs searched particular areas and why the university altered the shooting site. These were proposed connections, not an authenticated forensic reconstruction. [19]", "The state’s July memorandum, citing the medical examiner and ATF, describes a gunshot wound and a fragmented .30-caliber-class bullet. [1] Any exploding-microphone theory has to reckon with that. Photographs of fragments do not establish what they are made of or where they came from. We found no public lab report showing an explosive in the microphone. Nor will we invent a negative residue test just to make the rebuttal sound airtight.", "In episode 290, listed January 14, 2026, Owens discussed Kirk’s purported remarks about being a time traveler and linked foreknowledge of his death to “Project Looking Glass.” She said she had previously shown a text exchange, so it would be wrong to wave the story off by claiming she never displayed any messages. Whether they are real, what the context was and what he meant are separate questions. A man’s remark about time travel does not establish that time travel happened. [20]", "The newer footage claims deserve the same care.", "In episode 393, posted September 25, 2026, Owens revisited a Dairy Queen image that had been assigned a 6:38 p.m. timestamp. She acknowledged her team had assumed the surveillance clock was right. She suggested the display might instead show UTC, which would make it 12:38 p.m. in Utah. That was a hypothesis about the clock, not a verified correction. She also argued that apparent differences in exhaust showed two Dodge Challengers. [21]", "Proving any of that takes the original footage, the camera settings and a solid identification of the cars. A clock you can’t trust can’t build an alibi. And choosing whichever time zone suits the theory tells you nothing about which one the camera used.", "Episode 400, on October 8, examined staff transport to Timpanogos Hospital, white vehicles she described as federal, changes into hospital scrubs, and differences between the accounts of Harpole and Christian author Frank Turek. It raised questions about McCoy and commentator Blake Neff, among others. We could not independently confirm what those vehicles were, where they went or what any of it means. And one person leaving something out is not the same as two people contradicting each other. [23]", "Episode 401 went further, alleging that Provo officer and Utah legislator Tyler Clancy disposed of a bloodied bag. Owens played a clip attributed to Turek in which he describes asking an officer to dispose of his blood-soaked bag after authorities released the vehicle. That is a lead worth testing against the complete interview, property records and police accounts. On its own, it neither identifies the officer nor establishes deliberate destruction of evidence. [24]", "Even the episode’s date demands care: the transcript labels it October 13, while Apple’s feed records publication at 00:07 UTC on October 14. Both can describe the same release, seen from different time zones. Not every mismatch is a contradiction. [24,25]", "## Same Rules for Everyone", "The best questions still standing are the ones you can actually check: how the event was secured, how the evidence was collected, what the forensic results can bear, and whether the surveillance reconstruction holds up under adversarial attack. Answering them takes records and witnesses, including answers that embarrass officials and podcast hosts alike.", "Robinson remains presumed innocent. Owens remains entitled to question the state. The people she implicates remain entitled to have accusations kept separate from findings. The rules are the same for all three: name the source, respect its limits, and show how the evidence gets you to the conclusion.", "The case contains real failures. Figuring out who is responsible for them, and whether any of it bears on the criminal case, is harder than finding the next anomaly. It is also the only work worth doing.", "#T {\"title\": \"Official and court chronology\", \"head\": [\"Date\", \"Time\", \"Event\", \"Record and status\"], \"rows\": [[\"September 10, 2025\", \"11:00 a.m.\", \"Planned joint security meeting did not take place.\", \"UVU review; planned time, not an occurrence. [7]\"], [\"September 10, 2025\", \"Approximately 12:23:28 p.m.\", \"Shooting.\", \"Prosecution reconstruction. [1]\"], [\"September 10, 2025\", \"12:39 p.m.\", \"First FBI agents arrived.\", \"Patel’s official account. [2]\"], [\"September 10, 2025\", \"Approximately 12:44 p.m.\", \"Bagley reached Losee rooftop.\", \"Witness testimony. [31]\"], [\"September 11, 2025\", \"Approximately 12:36 a.m.\", \"Alleged return near Campus Drive.\", \"Prosecution reconstruction. [1]\"], [\"September 11, 2025\", \"10:00 a.m.\", \"FBI suspect photographs released.\", \"Patel’s official account. [2]\"], [\"September 11, 2025\", \"10:45 a.m.\", \"Reward announced.\", \"Patel’s official account. [2]\"], [\"September 11, 2025\", \"Approximately 5:30 p.m.\",
