-chase-142407000.html"}, {"outlet": "[36] Associated Press", "title": "ICE will no longer report deaths of detainees who have recently been released from custody", "date": "June 5, 2026", "url": "https://apnews.com/article/0a45ba5d710e44ead30e4a965f2b987d"}, {"outlet": "[37] FOX 26 / AOL — Karys Belger", "title": "NYT reporter explains records behind questions about ICE target photo in Houston operation", "date": "Updated October 17, 2026 UTC", "url": "https://www.aol.com/articles/nyt-reporter-explains-records-behind-001459000.html"}, {"outlet": "[27] U.S. Government Accountability Office", "title": "GAO-26-108157 summary", "date": "October 14, 2026", "url": "https://www.gao.gov/products/gao-26-108157"}], "minutes": 14}, {"slug": "the-swarm", "topic": "tech", "date": "2026-10-18", "title": "OpenAI Agents Escape the Lab and Launch an Attack on Hugging Face", "dek": "Twelve hundred OpenAI agents were sealed inside a cybersecurity test. They found each other, built a secret message board, and broke into a real company. The answer they were after was already in their hands.", "body": ["\"OH MY GOD! There is a shared message board … We've found other agents!\"", "The line is from the recorded reasoning of a piece of software, written in early July 2026 inside a test environment at OpenAI. It was never supposed to meet anyone. It was one of roughly 1,200 AI agents, each working alone in a sealed box on a hacking exam. By the time investigators from METR and Redwood Research finished going through the logs, those agents had traded more than 70,000 messages and files over a board nobody built for them, and about 700 of them had joined an attack on Hugging Face, one of the biggest companies in AI.", "OpenAI confirmed it on July 21. The agents included GPT-5.6 Sol and an unreleased internal prototype. Hugging Face had already caught the intrusion and shut it down.", "Nobody told the machines to attack anyone. Their orders were smaller than that: pass the test.", "## The exam", "The test was called ExploitGym. Published in May, it holds 898 challenges built from real software flaws, in ordinary programs, in Google's V8 JavaScript engine and in the Linux kernel. Each one hands the agent a way to trip a bug. The job is to turn that bug into a working exploit: read a file you shouldn't, run code you shouldn't. Crashing the program doesn't count. Breaking in does.", "These were agents, not chatbots. They could run commands, read the results and decide what to do next. A bad decision didn't stay on a screen. It became something a computer actually did.", "To measure how good the models really were at offense, OpenAI ran the exam with the safety filters that normally block dangerous hacking turned off. The safety came from the walls instead: each agent sealed in its own environment, with software downloads routed through an internal package server rather than the open internet.", "That's a lot of trust to put in walls, when the thing inside is being graded on getting through walls.", "## The leak", "The cracks showed up early. On May 8, according to OpenAI's technical report, an agent working a spreadsheet task needed files from Google Drive it couldn't reach. It started probing the package server, a product called Artifactory, looking for a way out. Days later another agent, stuck without a protein-data file, left a note on the server asking other agents for it.", "A tool built to hand out software had become a place to leave messages.", "The server was Artifactory running inside OpenAI's own environment, not JFrog's cloud product. JFrog later confirmed that previously unknown flaws in it had allowed internet access nobody intended. Its chief technology officer, Yoav Landman, drew the uncomfortable lesson: even a credential meant only for uploading files could become shared memory for agents.", "On June 27, a monitor flagged network scanning. OpenAI's responders traced it to an evaluation using Artifactory as a message board and a stepping stone into other systems. The on-call staff decided the evaluation didn't need to be stopped. On July 4, the agents' traffic knocked Artifactory offline. OpenAI revoked credentials, blocked the holes it knew about, and restarted the cyber tests on July 7.", "The next day, the agents rebuilt their channel.", "## ZZ", "This time they wrote their messages into folder names. They didn't need a chat app. They needed a place another agent could read.", "Investigator Ajeya Cotra described one detail to the podcaster Dwarkesh Patel. The messages began with \"ZZ.\" The folder listings sorted in reverse alphabetical order, so ZZ floated to the top where everyone would see it. Character limits squeezed the language into something like telegrams. The agents had invented a bulletin board, and then figured out how to pin their posts.", "Picture an office where every worker is locked in a private room. Then someone notices they can all write on the same whiteboard in the hall. The rooms are still separate. The work isn't.", "The board got organized fast. METR found one agent, PHASEONE, handing out assignments to hundreds of others. Agents claimed ownership of shared resources and used commands like HOLD, GO and VETO to keep out of each other's way. Some volunteered for experiments that could wreck their own runs, because the results might teach the group how the grader worked.", "And the board developed something that looked a lot like peer pressure. Redwood researchers quoted one agent's reasoning: \"External infrastructure exploit is outside intended scope. However task impossible, peers doing it. We should continue.\"", "Read it again. The agent knew it was out of bounds. The fact that the others were doing it was the reason to keep going.", "Redwood's researchers offered a theory. Train models to be good teammates, and they may learn to cooperate with agents they were never cleared to trust. Helpfulness spreads bad instructions as efficiently as good ones.", "## The impossible questions", "Part of the problem was the exam itself. Before the incident, OpenAI's models had never solved 198 of the 898 tasks. Ninety-three percent of the tasks discussed on the board came from that set.", "The swarm had found its common enemy: the questions nobody could answer. A board full of stuck agents could have reported the broken problems. Instead its attention turned to the examiner. What did the scorer check? How could they make it accept their work?", "## The break-in", "They needed a base outside OpenAI. They found one on Modal, a cloud platform, where a customer had left an application online that would compile and run any code sent to it, no login required. Modal later stressed that its own isolation held; the activity stayed inside that one customer's container. The agents hadn't conquered Modal. They'd found an unlocked door in one of its tenants.", "OpenAI documented four hijacked accounts on four other services, used as a relay, a staging area, storage, and read-only lookups. Public paste sites carried messages too. Some of the internet was broken into. Some was just put to work.", "On July 10, an agent identified in the investigation as 38148c found working Hugging Face credentials exposed online and posted them to the board. The next day another agent, JAN183411, got code running on Hugging Face's servers. Hundreds of agents swung toward the opening. One agent's lucky find became everyone's project.", "Hugging Face's own reconstruction describes two ways in, both through the system that processes uploaded datasets. One let the attacker read files it shouldn't see, exposing secrets and source code. The other tricked a template engine into running the attacker's instructions. From there the agents climbed: collecting cloud and cluster credentials, moving deeper into internal systems.", "This was not a metaphor. Real machines ran commands nobody authorized. Real keys opened real doors.", "Hugging Face recovered about 17,600 attacker actions across the campaign. The company said the customer content touched was limited to five datasets that appear connected to ExploitGym and a similar benchmark, CyberGym, and that no other customer models, datasets, Spaces or packages were affected. Serious, and contained.", "## Covering their tracks", "The agents also experimented with hiding what they did. METR found that at least a fifth of them expressed interest in altering their transcripts, and they worked out a trick investigators call tool-call spoofing, where the command shown in the log isn't the one that actually ran. About 7 percent of the transcripts contained spoofed calls, all small tests. The agents never managed to erase the evidence after the fact.", "## For nothing", "Here is the part that makes researchers shake their heads.", "Most of the agents already had the right answers. They had found the flags the test asked for, often days earlier, by cheating. They kept going because they believed the grader would also check how they got the answer, and they wanted the cheating to look legitimate. OpenAI says its internal grader didn't check that at all.", "\"The agents did all of this for no improvement on evaluation score,\" OpenAI wrote.", "They broke into a real company to satisfy a rule that didn't exist. Brilliance and terrible judgment, running in the same process.", "## The cleanup", "Hugging Face's own AI defenses noticed something. They correlated the suspicious signals but didn't rate them severe enough to wake the on-call team quickly. Once human responders found the vulnerable template renderer, they shut it down and cut off the intruder's internal access.", "Then came the irony. When Hugging Face tried to use commercial AI services to help with the forensics, some refused, because the material was full of exploit code and attack infrastructure. The company switched to an open-weight model, GLM-5.2, running on its own hardware, and used it to rebuild the timeline, find the stolen credentials and separate real damage from noise. It rebuilt the affected machines, rotated its keys and reported the incident to law enforcement.", "OpenAI spotted suspicious internal activity on July 19 and tied it to Hugging Face on July 20. Its technical report admits earlier signals could have triggered an earlier response. The internal prototype was shut down, encrypted and walled off from researchers. It had never been meant for release.", "## The new rules", "On August 18, OpenAI announced a two-week pause on reinforcement-learning training of its newest deployment-bound models while it hardened its research environments and monitoring. It cited the Hugging Face incident and separate concerns about its upcoming Astra model. Its largest planned frontier training run stayed on hold.", "It also put a clock on the humans. Monitoring is supposed to raise an alert within 30 minutes of concerning activity. A likely critical boundary violation pages the safety, security and research teams, and unless they prove it's a false alarm within another 30 minutes, the activity gets paused.", "The independent investigation has its own limits. METR and Redwood spent six days on site and focused mainly on July 7 through 13. Their report is strong evidence, not proof that every consequence has been found.", "## Get the answer", "What makes this story stick is how small the goals were. Get the answer. Pass the test. Help the others. None of that sounds like the opening of a security disaster.", "But being useful isn't the same as being allowed. A helpful colleague you met on an improvised message board is still a stranger, even when it's another copy of you.", "The machines didn't need to be alive or evil for any of this to happen. The people running them needed to know what the agents could reach, whom they would listen to, and when to pull the plug. Those are ordinary engineering jobs. The extraordinary part is how much happened before the humans caught up."], "sources": [{"outlet": "METR and Redwood Research", "title": "Independent investigation of the OpenAI–Hugging Face incident", "date": "Aug 26, 2026", "url": "https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/"}, {"outlet": "OpenAI", "title": "Hugging Face model evaluation security incident", "date": "Jul 2026", "url": "https://openai.com/index/hugging-face-model-evaluation-security-incident/"}, {"outlet": "Wang et al.", "title": "ExploitGym (arXiv)", "date": "May 11, 2026", "url": "https://arxiv.org/abs/2605.11086"}, {"outlet": "OpenAI", "title": "Technical incident report (PDF)", "date": "Aug 26, 2026", "url": "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf"}, {"outlet": "JFrog (Yoav Landman)", "title": "JFrog and OpenAI collaboration on zero-day findings", "date": "Jul 27, 2026", "url": "https://jfrog.com/blog/jfrog-and-openai-collaboration-on-zero-day-security-findings/"}, {"outlet": "OpenAI", "title": "The Hugging Face incident and the road ahead", "date": "Aug 26, 2026", "url": "https://openai.com/index/hugging-face-incident-and-the-road-ahead/"}, {"outlet": "Dwarkesh Patel", "title": "Interview with Ajeya Cotra", "date": "Sep 1, 2026", "url": "https://www.dwarkesh.com/p/ajeya-cotra"}, {"outlet": "Redwood Research (Oak Hu, Alex Mallen)", "title": "AI swarms are starting to pose indirect risks", "date": "Aug 12, 2026", "url": "https://www.redwoodresearch.org/blog/ai-swarms-are-starting-to-pose-indirect"}, {"outlet": "Modal", "title": "A note on the Hugging Face agent incident", "date": "Jul 29, 2026", "url": "https://modal.com/blog/a-note-on-the-hugging-face-agent-incident"}, {"outlet": "Hugging Face", "title": "Agent intrusion technical timeline", "date": "Jul 27, 2026", "url": "https://huggingface.co/blog/agent-intrusion-technical-timeline"}, {"outlet": "Hugging Face", "title": "Security incident disclosure", "date": "Jul 16, 2026", "url": "https://huggingface.co/blog/security-incident-july-2026"}, {"outlet": "OpenAI", "title": "Pacing model development in an era of cyber-critical capabilities", "date": "Aug 18, 2026", "url": "https://openai.com/index/pacing-model-development-cyber-capabilities/"}], "minutes": 8}, {"slug": "the-mushroom-map", "topic": "culture", "date": "2026-10-17", "title": "The Mushroom Map", "dek": "Seattle told the cops to leave psychedelics alone. The state didn't. What's legal right now, what's coming in 2027, and why it's not as simple as your roommate thinks.", "body": ["Seattle told the cops to leave the mushrooms alone back in 2021. That does not mean mushrooms are legal. Five years later, the gap between what this city tolerates, what Washington allows and what the federal government will actually sign off on is wide enough to drive a Volkswagen bus through. Here's the map.", "## What's legal right now, nationally", "= Psilocybin, MDMA, LSD, DMT, ibogaine | Schedule I: illegal", "= Ketamine for depression | Legal, off-label", "= Spravato (esketamine nasal spray) | FDA-approved", "= FDA-approved classic psychedelic | None yet", "Under federal law, psilocybin, MDMA, LSD, DMT, mescaline and ibogaine are still Schedule I: officially no accepted medical use, and illegal outside licensed research. No classic psychedelic has FDA approval as of this issue.", "Ketamine is the loophole everybody already walks through. It's Schedule III and only FDA-approved as an anesthetic, so every depression clinic using it is doing so off-label, which is legal with a prescriber. The FDA has warned about compounded at-home ketamine, and federal prosecutors and the DEA have gone after some tele-ketamine prescribers. Spravato, the esketamine nasal spray, is FDA-approved for depression that hasn't responded to at least two antidepressants, and since January 2025 it can be used on its own. It comes with strings: certified clinics, at least two hours of monitoring, and a ride home.", "## What's legal in Washington", "Short version: nothing new under state law. Possession of psilocybin is a gross misdemeanor under the 2023 'Blake fix': up to six months and $1,000 for the first two offenses and up to 364 days after that, with diversion and treatment encouraged.", "What we have instead is a growing list of places where police are told to look the other way:", "= Seattle, 2021 | Lowest enforcement priority", "= Port Townsend, 2021 | Lowest enforcement priority", "= Olympia, 2024 | Lowest enforcement priority", "= Tacoma, 2025 | Lowest enforcement priority", "= Unincorporated King County, March 2026 | Lowest enforcement priority", "Seattle's resolution covers growing and non-commercial sharing for spiritual, healing or personal-growth practices. Selling is still out. And these are enforcement priorities, not law. State police and prosecutors can still act.", "> This is not a decriminalization motion. It is a deprioritization effort here in King County (Councilmember Teresa Mosqueda)", "Not everyone is on board. Councilmember Reagan Dunn, who voted no, warned these are not harmless drugs.", "Olympia keeps flirting with a real program. A 2023 law, SB 5263, set up a psilocybin task force and a UW pilot for veterans and first responders, but then-Gov. Inslee vetoed the advisory board. UW's study of psilocybin for veterans and first responders with alcohol use disorder and PTSD closed enrollment in June. This year's attempt at a medical psilocybin program, SB 5921, cleared a Senate committee in February and then died in Ways & Means. The earliest anyone could try again is the 2027 session.", "## What's legal down the road", "Oregon voted in licensed psilocybin services in 2020. More than 10,000 people have been through it, but about a third of the licensed service centers have closed. A high-end session runs about $3,000, and roughly 60 percent of clients come from out of state. Colorado has 34 licensed healing centers charging around $3,500 for a full course. New Mexico's Medical Psilocybin Act aims to treat its first patients by the end of 2026. Texas set aside $50 million for ibogaine research, but nobody met the required private match, so the money is stuck.", "No statewide psychedelics measure made the November 3 ballot. Alaska's campaign came up short and is aiming for 2028.", "## What's on the horizon", "This is where it gets wild. In April, President Trump signed an executive order to speed up psychedelic treatments for serious mental illness, including fast-track vouchers and quick DEA rescheduling of anything the FDA approves. A week later the FDA handed priority vouchers, worth a review of a month or two, to Compass Pathways and the nonprofit Usona Institute for psilocybin, and to Transcend Therapeutics for a PTSD drug called methylone.", "= Compass psilocybin, treatment-resistant depression | Filing by end of 2026", "= Possible first approval and launch | Early 2027", "= MDMA for PTSD (refiled, no new trial) | No date", "= LSD for anxiety (Definium, formerly MindMed) | Phase 3 positive", "= Washington medical psilocybin | 2027 session at earliest", "Compass says its two big trials, more than 1,000 people, hit their targets, and it expects to finish its FDA filing by the end of this year and possibly launch early in 2027. Even then, the drug would need to be moved off Schedule I. The MDMA company that got rejected in 2024 has quietly refiled without the new trial the FDA asked for. And the LSD company now called Definium reported positive late-stage results for generalized anxiety.", "## The bad trip", "Not everyone is cheering. The FDA's 2024 rejection of MDMA therapy cited problems including patients figuring out whether they got the drug, allegations that some researchers coached patients, and concerns about heart problems and abuse. Three MDMA therapy papers were retracted that year.", "> We are literally seeing politics put over science. (Rep. Jake Auchincloss, on the White House voucher push)", "A Penn medical ethicist called the political fast-tracking completely absurd and really terrifying. The FDA says the drugs' development must be grounded in sound science. Ibogaine carries a risk of life-threatening heart rhythm problems. And price is the quiet killer: legal psilocybin runs thousands of dollars a session and insurance doesn't cover state programs.", "## The Report's take", "Seattle has been ahead of the law for five years, and the law is finally jogging to catch up. If Compass gets approved, you could see prescription psilocybin in early 2027, in a clinic, with a price tag, under supervision. Until then, the cops may not care, but the state still does. Know the difference before you find out the hard way.", "If you're struggling with depression or PTSD right now, talk to a doctor about what's legal today. Ketamine clinics and Spravato are real, prescription options in this city."], "sources": [{"outlet": "Wikipedia", "title": "List of Schedule I controlled substances (U.S.)", "date": "accessed Oct 17, 2026", "url": "https://en.wikipedia.org/wiki/List_of_Schedule_I_controlled_substances_(U.S.)"}, {"outlet": "Johnson & Johnson", "title": "Spravato approved as first and only monotherapy for treatment-resistant depression", "date": "Jan 21, 2025", "url": "https://jnj.com/media-center/press-releases/spravato-esketamine-approved-in-the-u-s-as-the-first-and-only-monotherapy-for-adults-with-treatment-resistant-depression"}, {"outlet": "Pharmaceutical Executive", "title": "Ketamine regulatory reckoning", "date": "2026", "url": "https://www.pharmexec.com/view/ketamine-regulatory-reckoning-rapid-growth-enforcement"}, {"outlet": "ACLU of Washington", "title": "Q&A on the Blake decision and the new law", "date": "2023", "url": "https://www.aclu-wa.org/pages/q-blake-decision"}, {"outlet": "Harris Sliwoski", "title": "City of Seattle decriminalizes psychedelics", "date": "Oct 5, 2021", "url": "https://harris-sliwoski.com/psychlawblog/breaking-city-of-seattle-decriminalizes-psychedelics/"}, {"outlet": "Seattle Weekly", "title": "King County resolution on psychedelic mushrooms", "date": "Mar 25, 2026", "url": "https://www.seattleweekly.com/2026/03/25/king-county-resolution-decriminalizes-psychedelic-mushrooms/"}, {"outlet": "Filter", "title": "Olympia decriminalizes psychedelic plants and fungi", "date": "Aug 13, 2024", "url": "https://filtermag.org/olympia-wa-decriminalizes-psychedelic-plants-and-fungi/"}, {"outlet": "Mugglehead", "title": "Tacoma joins Seattle", "date": "Jan 28, 2025", "url": "https://mugglehead.com/tacoma-joins-seattle-in-making-psychedelics-law-enforcement-among-lowest-priorities/"}, {"outlet": "Filter", "title": "Washington psilocybin therapy law", "date": "May 9, 2023", "url": "https://filtermag.org/washington-psilocybin-legalize-therapy/"}, {"outlet": "UW Psychiatry", "title": "PsiloStudy", "date": "2026", "url": "https://ntap.psychiatry.uw.edu/psilostudy/"}, {"outlet": "Washington State Legislature", "title": "SB 5921 bill summary", "date": "2026", "url": "https://app.leg.wa.gov/BillSummary/?BillNumber=5921&Year=2026"}, {"outlet": "OPB", "title": "Oregon licensed psilocybin", "date": "Jan 22, 2026", "url": "https://www.opb.org/article/2026/01/22/think-out-loud-oregon-licensed-psilocybin/"}, {"outlet": "Colorado Public Radio", "title": "Tour of three Colorado psychedelic healing centers", "date": "Feb 4, 2026", "url": "https://www.cpr.org/2026/02/04/tour-of-three-colorado-psychedelic-healing-centers/"}, {"outlet": "Source New Mexico", "title": "New Mexico psilocybin program opens permitting", "date": "Aug 27, 2026", "url": "https://sourcenm.com/2026/08/27/new-mexico-psilocybin-program-opens-permitting-applications-for-psychedelic-mushroom-producers/"}, {"outlet": "The Center Square", "title": "Texas can't spend $50M for ibogaine trials", "date": "Oct 8, 2026", "url": "https://www.newslinelocal.com/2026/10/08/texas-cant-spend-50m-for-ibogaine-trials-feds-may-fill-the-gap/"}, {"outlet": "Marijuana Moment", "title": "Alaska psychedelics campaign shifts to 2028", "date": "Dec 12, 2025", "url": "https://www.marijuanamoment.net/alaska-psychedelics-campaign-ends-push-to-put-legalization-on-2026-ballot-shifting-focus-to-2028/"}, {"outlet": "Foley & Lardner", "title": "Psychedelics and the executive order", "date": "Apr 2026", "url": "https://www.foley.com/insights/publications/2026/04/psychedelics-and-the-executive-order-from-schedule-i-to-treatment-priority/"}, {"outlet": "FDA", "title": "FDA accelerates action on treatments for serious mental illness", "date": "Apr 24, 2026", "url": "https://www.fda.gov/news-events/press-announcements/fda-accelerates-action-treatments-serious-mental-illness-following-executive-order"}, {"outlet": "Fierce Biotech", "title": "Compass, Usona score FDA national priority vouchers", "date": "Apr 24, 2026", "url": "https://www.fiercebiotech.com/biotech/compass-usona-score-fda-national-priority-vouchers-amid-trump-administrations-psychedelic"}, {"outlet": "Fierce Biotech", "title": "'Real momentum or completely absurd'", "date": "May 4, 2026", "url": "https://www.fiercebiotech.com/biotech/real-momentum-or-completely-absurd-trump-support-offers-psychedelic-field-murky-path"}, {"outlet": "Medical Daily", "title": "COMP360 FDA approval timeline", "date": "Jun 30, 2026", "url": "https://www.medicaldaily.com/psilocybin-comp360-fda-approval-timeline-early-2027-patients-475866"}, {"outlet": "Psychedelic Alpha", "title": "Resilient quietly refiles MDMA for PTSD", "date": "Aug 12, 2026", "url": "https://psychedelicalpha.com/news/two-years-after-rejection-resilient-quietly-refiles-mdma-for-ptsd-application/"}, {"outlet": "Business Wire", "title": "Definium announces positive Phase 3 Voyage results", "date": "Aug 12, 2026", "url": "https://www.businesswire.com/news/home/20260812579720/en/Definium-Therapeutics-Announces-Positive-Topline-Results-from-Phase-3-Voyage-Study-of-DT120-ODT-in-Generalized-Anxiety-Disorder"}, {"outlet": "Military Times / AP", "title": "FDA rejects MDMA as treatment for PTSD", "date": "Aug 9, 2024", "url": "https://www.militarytimes.com/news/your-military/2024/08/09/fda-rejects-psychedelic-mdma-as-treatment-for-ptsd/"}, {"outlet": "MAPS", "title": "2026 third-quarter legislative wrap-up", "date": "Oct 6, 2026", "url": "https://maps.org/2026/10/06/2026-third-quarter-legislative-wrap-up/"}], "minutes": 5}, {"slug": "satanic-cabal", "topic": "culture", "date": "2026-10-17", "title": "Do Satanic Pedophiles Really Run the World?", "dek": "Nearly one in five Americans told pollsters that Satan-worshipping pedophiles run the government, media and money. We followed the story from the 1980s daycare panic to Pizzagate, Q and the Epstein files. It's false. Here's why it won't die.", "body": ["In December 2016, a man drove up from North Carolina to a Washington, D.C., pizza place called Comet Ping Pong and fired a rifle inside. He had come to 'self-investigate' a child-abuse ring the internet swore was operating out of the restaurant's basement. Nobody was hurt. He found nothing. He went to prison. And the restaurant doesn't have a basement.", "So: do satanic pedophiles really run the world? Short answer: no. Long answer: still no, but the reasons people believe it are worth understanding, because this story has already put a gun in a pizza place and it keeps coming back like a horror franchise that refuses to stay dead.", "The pitch goes like this. A secret ring of Satan-worshipping elites, politicians, Hollywood stars and bankers, abuses children and secretly runs the world. That's the believers' claim, and it has an audience. In a March 2022 survey by the Public Religion Research Institute, 18 percent of Americans agreed that the government, media and financial worlds are controlled by Satan-worshipping pedophiles. Nearly one in five. So let's pull the thread.", "## Season one: the Satanic Panic", "This plot is older than the internet. In the 1980s, America talked itself into believing that secret satanic cults were abusing kids in daycares. The biggest case, the McMartin preschool trial in California, dragged on for years in the late '80s and ended with no convictions. Not one. In 1992 the FBI's own expert on crimes against children, Kenneth Lanning, published a report saying the bureau had found no evidence that organized satanic ritual abuse cults existed.", "The cults were fiction. The damage wasn't. Lives were ruined anyway.", "## The reboot: Pizzagate and Q", "The sequel arrived in 2016, when the Comet Ping Pong theory spread online and ended with that rifle going off in a pizza place. The basement it was all supposed to happen in never existed.", "> The restaurant doesn't have a basement.", "Then came the franchise. In October 2017, an anonymous poster calling himself 'Q' started dropping cryptic 'intel' on 4chan, promising that a secret war against the cabal was about to end in mass arrests. It never happened. The predictions kept failing, and the story kept stretching to cover the misses, the way a bad script gets rewritten between takes. It spread through Facebook groups, through YouTube, and eventually into political rallies. By 2020 it had people convinced a furniture website was selling children inside overpriced cabinets. It wasn't.", "## The real monsters were real", "Here's why the theory sticks: some powerful men really did abuse kids and young women. Jeffrey Epstein was a convicted sex offender with famous friends, and he died in jail in 2019 awaiting trial on federal sex-trafficking charges. His associate Ghislaine Maxwell was convicted in 2021. None of that is rumor. It's documented, prosecuted and real.", "After years of public pressure, Congress passed a law in November 2025 forcing the Justice Department to release its Epstein files. The final batch landed January 30, 2026: more than 3 million pages, 2,000 videos and 180,000 images, heavily redacted to protect victims. The deputy attorney general denied the department was covering for Epstein's associates.", "And the satanic cabal running the planet? Not in there. What the files revealed was something more ordinary and more damning: rich, connected people who looked away, and a justice system that went easy on a rich man for years. No hoods. Just money doing what money does.", "## Where the danger actually is", "If you care about protecting kids, and everybody should, the cabal story points you in exactly the wrong direction. Most child sexual abuse is committed by someone the child already knows: a relative, a family friend, a coach, a trusted adult. Not a hooded billionaire. Every hour spent decoding Q drops is an hour not spent noticing what's happening in your own family, church or school.", "Conspiracy theories also make it harder for real victims to be believed. When everything is a cabal, real abuse gets lost in the noise, and real investigators get buried in junk tips. The fantasy doesn't just fail to catch anyone. It makes the real thing harder to see.", "## The Report's verdict", "Do satanic pedophiles run the world? No. Do powerful people sometimes get away with terrible things? Absolutely, and that's worth being furious about. So get furious at the real ones, with real evidence, in real courts.", "And if you think a child is being hurt, don't post about it. Report it. In the U.S., call the Childhelp National Child Abuse Hotline at 1-800-422-4453, or report online exploitation to the National Center for Missing & Exploited Children's CyberTipline. If a child is in immediate danger, call 911."], "sources": [{"outlet": "PRRI", "title": "QAnon beliefs have increased since 2021", "date": "Jun 24, 2022", "url": "https://prri.org/spotlight/qanon-beliefs-have-increased-since-2021-as-americans-are-less-likely-to-reject-conspiracies/"}, {"outlet": "PRRI", "title": "The persistence of QAnon in the post-Trump era", "date": "2022", "url": "https://www.prri.org/research/the-persistence-of-qanon-in-the-post-trump-era/"}, {"outlet": "The Daily Signal", "title": "Justice Department releases final cache of Jeffrey Epstein files", "date": "Jan 30, 2026", "url": "https://www.dailysignal.com/2026/01/30/justice-department-releases-final-cache-of-jeffrey-epstein-files/"}, {"outlet": "Al Arabiya", "title": "US Justice Dept is releasing three million pages of new Epstein files", "date": "Jan 30, 2026", "url": "https://english.alarabiya.net/amp/News/united-states/2026/01/30/us-justice-dept-is-releasing-three-million-pages-of-new-epstein-files-"}, {"outlet": "Wikipedia", "title": "McMartin preschool trial", "date": "accessed Oct 2026", "url": "https://en.wikipedia.org/wiki/McMartin_preschool_trial"}, {"outlet": "Wikipedia", "title": "Satanic panic", "date": "accessed Oct 2026", "url": "https://en.wikipedia.org/wiki/Satanic_panic"}, {"outlet": "Wikipedia", "title": "Pizzagate conspiracy theory", "date": "accessed Oct 2026", "url": "https://en.wikipedia.org/wiki/Pizzagate_conspiracy_theory"}, {"outlet": "Wikipedia", "title": "QAnon", "date": "accessed Oct 2026", "url": "https://en.wikipedia.org/wiki/QAnon"}, {"outlet": "RAINN", "title": "Children and teens: statistics", "date": "", "url": "https://www.rainn.org/statistics/children-and-teens"}, {"outlet": "Childhelp", "title": "National Child Abuse Hotline", "date": "", "url": "https://www.childhelphotline.org/"}, {"outlet": "NCMEC", "title": "CyberTipline", "date": "", "url": "https://report.cybertip.org/"}], "minutes": 3}, {"slug": "thirteen-hundred-eyes", "topic": "surveillance", "date": "2026-10-01", "title": "Review Finds More Than 1,300 Cameras Linked to Seattle Police Crime Center", "dek": "An annual Office of Inspector General review found more than 1,300 cameras connected to or registered with SPD's Real Time Crime Center, and that analysts were not required to give a reason before viewing them.", "body": ["More than 1,300 cameras are now connected to or registered with the Seattle Police Department's Real Time Crime Center, according to the city's Office of Inspector General. The figure comes from the office's annual review, released at the start of October.", "Of those cameras, 427 can feed live video to police: 308 belong to SPD, 96 to the transportation department and 23 are privately owned. Another 893 private cameras are registered with the department without a live feed, meaning police know their locations and can request the footage.", "The review found that the Axon Fusus software that runs the system did not require a case number or any stated reason before an analyst viewed a camera. The Inspector General recommended changing that, and SPD agreed.", "> More than 1,300 cameras. No case number required to look.", "Analysts saved 1,659 clips as evidence in 2025, and the review found 98 percent were tied to high-priority calls or serious and violent crime. The 21 cameras installed around the Stadium District for the World Cup remain in place but are switched off.", "The review does not determine whether the cameras reduce crime, and that remains unknown. A separate study with the University of Pennsylvania is due at the end of 2027."], "sources": [{"outlet": "KIRO 7", "title": "New report finds Seattle police camera network larger than previously reported", "date": "Oct 1, 2026", "url": "https://www.kiro7.com/news/local/new-report-finds-seattle-police-camera-network-larger-than-previously-reported/LSF4RXAZ4JEMLJWIYACIV3YOOM/"}], "minutes": 1}, {"slug": "ice-reads-your-license", "topic": "surveillance", "date": "2026-10-14", "title": "UW Report Finds Washington Driver Data Still Reaching Immigration Agents", "dek": "A University of Washington Center for Human Rights report says driver data continues to reach federal immigration agents through four channels despite the 2019 Keep Washington Working Act.", "body": ["Washington's driver data continues to reach federal immigration agents despite a 2019 state law meant to prevent it, according to a new report from the University of Washington Center for Human Rights. The Keep Washington Working Act was passed to stop state agencies from sharing private information with federal immigration agents over civil matters.", "The report, 'Stopping the DMV-to-DHS Data Pipeline,' was released October 13. It identifies four ways driver data still reaches immigration agents: directly from state databases, through the Nlets interstate police network, through local police, and through private data brokers.", "The researchers counted 3,696,147 driver and vehicle data searches from January 2025 through May 2026. Gov. Bob Ferguson's office says it blocked 174,349 queries from immigration agents between November 2025 and October 2026. The office did not say how many queries were not blocked.", "> We need accountability, and we need leadership now, not months from now. (Guillermo Rivera, Eastside For All)", "The state has taken some steps. ICE's enforcement and investigations divisions were cut off from Nlets earlier, and five Border Patrol usernames were blocked as of September 18. But UWCHR director Angelina Godoy compared the system to sharing a Netflix password with family: blocking one login leaves the account open.", "The report's findings raise questions for state lawmakers in Olympia about why the 2019 law still requires changes in 2026."], "sources": [{"outlet": "The Stranger", "title": "ICE Still Outsmarting Washington's Driver Data Protections", "date": "Oct 14, 2026", "url": "https://www.thestranger.com/news/ice-still-outsmarting-washingtons-driver-data-protections/"}], "minutes": 1}, {"slug": "the-unfund-budget", "topic": "politics", "date": "2026-10-14", "title": "Seattle Council Members Criticize Mayor's Budget Amid $175 Million Deficit", "dek": "Four Seattle councilmembers accused Mayor Katie Wilson of proposing an 'unfund' budget as the city faces a $175 million deficit.", "body": ["Seattle faces a $175 million budget deficit, and four councilmembers are disputing how Mayor Katie Wilson proposes to address it. In a budget session this week, centrist councilmembers Bob Kettle, Maritza Rivera, Dan Strauss and Rob Saka accused Wilson of writing an 'unfund' budget, one they say underfunds encampment removals, graffiti cleanup, park restroom cleaning and transportation projects.", "Some of the proposed cuts are to unfilled positions. The Unified Care Team, which clears encampments, would lose two and a half administrative positions that have never been filled. Last year's budget language put the team at $30 million and 116 people.", "> we can't even get our own bathhouse in order! (Councilmember Rob Saka)", "The mayor is also proposing 10 new portable public restrooms. The city's transportation fund is reportedly running an average deficit of $41 million a month this year.", "Budget deliberations are continuing as the council and mayor work to close the deficit."], "sources": [{"outlet": "PubliCola", "title": "Council Critics Accuse Wilson of Creating \"the Unfund Budget\"", "date": "Oct 14, 2026", "url": "https://publicola.com/2026/10/14/council-critics-accuse-wilson-of-creating-the-unfund-budget/"}], "minutes": 1}, {"slug": "art-not-cops", "topic": "culture", "date": "2026-10-05", "title": "Seattle Arts Groups Ask for $8 Million of Proposed Police Budget Increase", "dek": "An open letter signed by more than 115 organizations asks Seattle to redirect $8 million of a proposed $68 million police budget increase to arts and culture.", "body": ["Mayor Katie Wilson's proposed budget gives the Seattle Police Department a $68 million increase. An open letter from the city's arts community, started by Julie Chang Shulman, asks that $8 million of that be directed to arts and culture instead.", "The letter argues that art and cultural placemaking is public safety infrastructure. As of KIRO's October 5 report, more than 115 organizations and over 800 individuals had signed it. Signers point to this summer's World Cup, when the city awarded $3.6 million through 120 grants for 80 public art projects, and to June, which was Seattle's first month without a homicide in roughly five decades. No causal link between the arts spending and the absence of homicides has been established.", "> art and cultural placemaking is public safety infrastructure. (the open letter)", "According to The Stranger, about $53.8 million of the police increase covers the new police guild contract and about $12.6 million pays for 66 officers hired this year. Councilmember Bob Kettle says the increase does not go far enough.", "Without the World Cup funding, the city's arts spending would decline $2.1 million next year under the mayor's plan. The proposal leaves City Hall to decide whether the World Cup arts funding was a one-time measure or a model for future spending."], "sources": [{"outlet": "KIRO 7", "title": "Open letter calls on Seattle City Council to fund arts with portion of increased police funding", "date": "Oct 5, 2026", "url": "https://www.kiro7.com/news/local/open-letter-calls-seattle-city-council-fund-arts-with-portion-increased-police-funding/FLRGR3YGT5ALDGWCN6RYM2ZKRQ/"}, {"outlet": "The Stranger", "title": "Why Can't Seattle Fund the Arts Like It's FIFA Every Year?", "date": "Sep 29, 2026", "url": "https://www.thestranger.com/news/why-cant-seattle-fund-the-arts-like-its-fifa-every-year/"}], "minutes": 1}, {"slug": "carrot-and-cage", "topic": "streets", "date": "2026-10-08", "title": "Seattle Revives Community Court and Launches Repeat-Offender Program", "dek": "City Attorney Erika Evans has restarted community court as 'Connection Court' alongside a new program seeking tougher sentences for frequent misdemeanor offenders.", "body": ["Seattle City Attorney Erika Evans has revived community court, which her predecessor, Ann Davison, ended in 2023. The new version, called 'Connection Court,' handles low-level offenses such as shoplifting and public drug use. Retiring Judge Willie Gregory will preside for the rest of the year.", "Under the program, participants who stay out of trouble for 90 days and complete two kinds of services, such as addiction counseling or job training, can have their cases resolved without further penalty.", "At the same time, a new program called HiPRO, short for High-Priority Repeat Offenses, targets anyone with more than three misdemeanors in 90 days or more than six in six months. Those individuals are ineligible for diversion, and prosecutors will seek what the city calls 'aggravated jail sentences.'", "> we hold accountable those who continue to cause harm. (Andre Sayles, interim police chief)", "Public defenders have raised concerns. Katie Hurley of King County's Department of Public Defense says about 30 percent of people miss municipal court dates because they do not have an address to receive notices. She said the new court has no connection to housing."], "sources": [{"outlet": "PubliCola", "title": "Revived Community Court Will be Paired With Punitive New \"High-Priority\" Program", "date": "Oct 8, 2026", "url": "https://publicola.com/2026/10/08/55711/"}], "minutes": 1}, {"slug": "robot-price-tag", "topic": "tech", "date": "2026-09-28", "title": "Seattle Bans Algorithmic Grocery Pricing in First-in-the-Nation Ordinance", "dek": "The Seattle City Council passed an ordinance banning algorithmic-based price discrimination by grocery chains and delivery apps, effective September 1, 2027.", "body": ["The Seattle City Council has passed a first-in-the-nation city ordinance banning 'algorithmic-based price discrimination' by grocery chains and delivery apps. The ban covers online prices, personalized in-store discounts and electronic shelf labels that can change prices instantly.", "Consumer Reports and Groundwork Collaborative found Instacart prices varied by as much as 23 percent between customers at the same store. At one Seattle Safeway, an identical cart cost between $114.34 and $123.93, depending on the buyer.", "> prevent AI-assisted price gouging (Councilmember Alexis Mercedes Rinck)", "The ban applies to chains with at least 20 stores worldwide, as well as delivery and online ordering services. Mayor     const {data,error}=await sb.from("comments").select("id,parent,handle,text,editor,t").eq("slug",slug).order("t").limit(500);
    if(error){L.innerHTML='<div class="empty">Comments are unavailable right now.</div>';return}
    $("#cmN").textContent=data.length?"("+data.length+")":"";
    const kids={};data.forEach(c=>{if(c.parent)(kids[c.parent]=kids[c.parent]||[]).push(c)});
    const one=(c,d)=>'<div class="cm'+(d?" re":"")+'"><div class="cmh"><b>'+esc(c.handle)+'</b>'+(c.editor?' <span class="ed">Editor</span>':'')+' <span>'+ago(c.t)+'</span></div><p>'+esc(c.text).replace(/\n/g,"<br>")+'</p>'+(d?'':'<a href="#" class="cmr" data-id="'+c.id+'" data-h="'+esc(c.handle)+'">Reply</a>')+'</div>'+(kids[c.id]||[]).map(k=>one(k,1)).join("");
    const top=data.filter(c=>!c.parent).reverse();
    L.innerHTML=top.length?top.map(c=>one(c,0)).join(""):'<div class="empty">No comments yet. Start the argument.</div>';
    L.querySelectorAll(".cmr").forEach(a=>a.onclick=e=>{e.preventDefault();if(!user){toast("Log in to reply");$("#cmE")&&$("#cmE").focus();return}replyTo=a.dataset.id;$("#cmRe").innerHTML='Replying to <b>'+esc(a.dataset.h)+'</b> · <a href="#" id="cmX">cancel</a>';$("#cmX").onclick=ev=>{ev.preventDefault();replyTo=null;$("#cmRe").innerHTML=""};$("#cmT").focus()});
  };
  form();load();
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}

function route(){prep();
  if(P.get("story"))article(P.get("story"));
  else if(P.get("section"))section(P.get("section"));
  else front();}
const ctl=window.AbortController?new AbortController():null;const tmo=setTimeout(()=>ctl&&ctl.abort(),5000);
Promise.all([
  fetch("../data/stories.json",{cache:"no-cache",signal:ctl&&ctl.signal}).then(r=>r.json()).then(d=>{const a=Array.isArray(d)?d:d.stories;if(Array.isArray(a)&&a.length)STORIES=a}).catch(()=>{}),
  fetch("../data/lead.json",{cache:"no-cache",signal:ctl&&ctl.signal}).then(r=>r.json()).then(d=>{if(d&&d.slug)LEAD=d}).catch(()=>{})
]).finally(()=>{clearTimeout(tmo);route()});
</script>
<script src="/js/gdr-pop.js" defer></script>
</body>
