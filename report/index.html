 "date": "Dated October 13, 2026", "url": "https://podprose.org/post/1426/candace-owens-america-ugly-general-cop-missing-bloodied-bag-transcript"}, {"outlet": "[25] Candace official podcast feed via Apple", "title": "Episode 401 publication metadata", "date": "October 14, 2026 at 00:07 UTC", "url": "https://podcasts.apple.com/au/podcast/america-the-ugly-a-general-a-cop-a/id1750591415?i=1000796226893"}, {"outlet": "[26] Candace via Podscripts", "title": "Egyptian military in Provo episode 255", "date": "Listed October 30, 2025", "url": "https://podscripts.co/podcasts/candace/breaking-news-the-egyptian-military-was-in-provo-on-910-candace-ep-255"}, {"outlet": "[27] Mediaite", "title": "Kolvet on providing messages to Joe Kent", "date": "March 23, 2026", "url": "https://www.mediaite.com/media/news/revealed-joe-kent-got-texts-candace-owens-used-to-ignite-kirk-conspiracies/"}, {"outlet": "[28] Associated Press via The Guardian", "title": "Roommate interview and hearing evidence", "date": "July 9, 2026", "url": "https://www.theguardian.com/us-news/2026/jul/09/erika-charlie-kirk-transparency-judge"}, {"outlet": "[29] PolitiFact", "title": "Bullet comparison inconclusive rather than mismatch", "date": "April 2, 2026", "url": "https://politifact.com/article/2026/apr/02/charlie-kirk-tyler-robinson-bullet-inconclusive/"}, {"outlet": "[30] Reuters", "title": "Kirk family plans security-related lawsuit", "date": "September 16, 2026", "url": "https://www.reuters.com/legal/government/family-charlie-kirk-plans-suit-against-utah-university-over-alleged-security-2026-09-16/"}, {"outlet": "[31] Court hearing via Rev", "title": "UT v Tyler Robinson day 1", "date": "July 6, 2026; transcript posted July 7", "url": "https://www.rev.com/transcripts/ut-v-tyler-robinson---day-1"}, {"outlet": "[32] Utah Valley University", "title": "Independent review release announcement", "date": "September 25, 2026", "url": "https://www.uvu.edu/news/2026/independent-review-release-2026.html"}, {"outlet": "[33] Candace via Podscripts", "title": "Who Ordered the Hit on Charlie Kirk episode 237", "date": "September 2025", "url": "https://podscripts.co/podcasts/candace/who-ordered-the-hit-on-charlie-kirk-candace-ep-237"}], "minutes": 14}, {"slug": "macklemore-vs-the-owners-box", "topic": "music", "date": "2026-10-18", "minutes": 7, "title": "Seattle's Macklemore Leads the Free Palestine Music Movement", "dek": "Two nights at MetLife, one phone call from Robert Kraft, and the biggest tour on earth lost its opener. Then the opener booked his own. How a stadium veto turned a pop tour into a fight over Gaza, and why it isn't over.", "body": ["The call came on a Monday. On September 7, according to Macklemore, Ed Sheeran told him privately that Robert Kraft had been on the phone. The New England Patriots owner would not let the Seattle rapper perform at Gillette Stadium, and other stadium owners felt the same way. Keep Macklemore, Sheeran was told, and the tour could lose the buildings.", "A week later Macklemore was off the tour. Within a day, three other opening acts and the Irish band that played inside Sheeran's own set had quit. Two nights in New Jersey had become a national argument about Palestine, antisemitism, free expression, and who actually controls a stadium stage.", "It still isn't over. Macklemore has booked his own benefit shows in Europe, Sheeran has rebuilt his lineup, and now even the charities on Macklemore's new tour are under fire.", "## The song that came first", "None of this should have surprised anyone. Ben Haggerty released \"Hind's Hall\" on May 6, 2024, named for the Columbia University building protesters renamed after Hind Rajab, a Palestinian child killed in Gaza. The track sampled Lebanese singer Fairuz and sent its streaming money to UNRWA, the UN agency for Palestinian refugees.", "Seattle saw the next chapter up close. At a Palestine benefit in Seward Park on September 21, 2024, he shouted \"Fuck America\" from the stage. The Kraken and Sounders criticized him, and a Las Vegas festival dropped him. He later said his anger had gotten ahead of his message. Anyone booking Macklemore in 2026 knew exactly where he stood.", "## Two nights in New Jersey", "Friday, September 4, MetLife Stadium. Before \"Hind's Hall,\" Macklemore called for Palestinian freedom while the screens behind him showed footage from Gaza, the West Bank and protest marches. His speech ran wider than the headline: Lebanon, Cuba, Congo, Sudan, Iran, and a shot at Immigration and Customs Enforcement.", "Saturday, he came back and spoke to Jewish fans in the crowd directly. \"Criticism of Israel, criticism of apartheid, being against genocide in no way is a criticism of you,\" he said, framing it as a matter of equal dignity. Critics heard hostility in the words and the imagery. Supporters heard a needed line drawn between Jewish people and Israel's government.", "By Sunday, the Israeli-American Council was petitioning for his removal. The petition went after Sheeran, his management and the venues, asking whether the speech, the footage and the song had been approved in advance. It wasn't just about Macklemore anymore. It was about what anyone could say on that stage.", "Pink weighed in next. She shared a StopAntisemitism post demanding apologies and refunds, then clarified on September 11. She pointed to Macklemore's 2014 costume, a fake nose and beard he had apologized for after it was called an antisemitic caricature, and described Jewish fans who felt afraid. But she was explicit: \"I don't need anyone fired, and I don't need a refund.\" She also wrote that Palestinians deserve a future that honors their humanity.", "## The owners' box", "The Wall Street Journal later reported that Kraft's call to Sheeran lasted 40 minutes. The two are close; Sheeran sang at Kraft's 2022 wedding. The Journal also named three more NFL owners who opposed Macklemore's appearances: Carolina's David Tepper, Atlanta's Arthur Blank and Philadelphia's Jeffrey Lurie, describing calls between owners, with Lurie landing where Tepper and Blank already were.", "On September 14, the promoter, Messina Touring Group, made it official. Venues had told it the shows couldn't go on with Macklemore on the bill, putting the rest of the tour at risk. He had been booked for eight of the ten remaining U.S. dates, starting September 19 in Philadelphia.", "Macklemore's statement that day described painful conversations with a friend of 13 years and a basic disagreement about neutrality. He accused critics of using charges of antisemitism to shield Israeli policy, while saying antisemitism itself is real. And he refused the victim role. He, Sheeran and Pink would all go home safe to their families, he wrote; Palestinians were living the actual catastrophe.", "\"I didn't need 10 shows from Ed. I needed 2.\"", "Kraft answered the same day. He cited the New Jersey shows and what he called a longer record of rhetoric and imagery offensive to Jews. He acknowledged Palestinian suffering, argued that Macklemore left out Hamas's responsibility, and offered to meet with him. His statement did not say whether he had organized the other owners. Kraft's stance has a long public track record: in 2019 he founded the Foundation to Combat Antisemitism with $20 million, now called the Blue Square Alliance Against Hate.", "## \"I am not complicit\"", "Sheeran spoke on September 15. Macklemore's contract was with the promoter, he said, and the promoter made the call. He said he had tried to mediate with the owners and owed it to ticket holders and his crew to keep the tour running. \"I am not complicit,\" he wrote.", "His lineup didn't buy it. The same day, Aaron Rowe, Lukas Graham and Finneas pulled out, along with Beoga, the Irish band that played during Sheeran's own set. Finneas had been booked for the South American leg in November, not the U.S. dates. \"Artists must not be silenced when they speak up for the oppressed,\" he wrote. Rowe pointed to Ireland's own history of famine and occupation. Beoga, co-founders of Irish Artists for Palestine, said they still counted Sheeran a friend. Every one of them was walking away from a stadium audience.", "## The money", "On September 16, Macklemore pledged all $1 million of his net tour earnings to six groups: Palestine Children's Relief Fund, HEAL Palestine, Gaza Soup Kitchen, Medical Aid for Palestinians, UNRWA USA and Anera. He dared Kraft to match it, and said writing a check is one of the cheapest ways to show solidarity.", "Kraft came back with a bigger number. He said Sheeran had already asked him to commit $2 million to match Sheeran's own gift for humanitarian relief in the region. KIRO 7 pointed out that the wording described a request, not a promise, and named no recipients and no timeline.", "The next day, Ms. Rachel, the children's star Rachel Accurso, said she would match Macklemore's million too, and named where it was going: Palestine Children's Relief Fund, where she is an ambassador.", "## The show goes on", "Sheeran played Philadelphia's Lincoln Financial Field on September 19 with no opener. Reading from prepared remarks, he apologized for mistakes, condemned the October 7 attacks, called Gaza \"catastrophic and unjustifiable,\" and spoke against injustice in the West Bank and against venues approving performers and content in advance. He said the whole thing made him wonder if he wanted to keep doing this. Protesters stood outside. The man who wanted to stay out of politics was now making a political speech every night.", "The Gillette shows that started it all never happened. A nor'easter canceled both nights on September 25. In early October, Zach Bryan played that same stadium in a \"Free Palestine\" shirt.", "Sheeran rebuilt the bill. Isaac Slade, formerly of The Fray, opened in Atlanta on October 3 and is booked for more dates, including Charlotte on October 17, Arlington on October 24 and Tampa on November 7. American Idol's Brooks Rosser joined in Indianapolis on October 10. The tour survived. The fight follows every lineup announcement.", "## The Free Palestine Tour", "Macklemore's answer came September 24. The Free Palestine Tour: Dublin's 3Arena on October 26, Paris's Accor Arena on October 29, London's OVO Arena Wembley on October 30, billed as Macklemore and Friends, with all proceeds going to Palestinian causes and U.S. dates promised. On September 30 he said all three had sold out.", "The beneficiary list grew to twelve. Beside the original six: Glia, Taawon, Middle East Children's Alliance, Jewish Voice for Peace, the Institute for Middle East Understanding and the Palestinian Youth Movement. Some of those are advocacy groups, not aid charities, which makes this a political fundraiser as much as a relief concert. His own site says the tour supports Palestinians and their movement.", "That drew the newest fire. On October 16, The Jewish Chronicle reported that Britain's Jewish Leadership Council had challenged the Palestinian Youth Movement's inclusion, citing a British spokesperson's description of Hamas's October 7 hostage-taking as legitimate and effective, and asked Live Nation what vetting governs the money. Those are claims and questions, not findings that any concert money has funded violence. The Chronicle said it asked Macklemore and Live Nation for comment and reported no answer from either.", "The real questions now are practical: how the proceeds get split, how much reaches each group, and when anyone will show the receipts. A sellout proves demand. It doesn't answer those.", "## Back to Seattle", "For Seattle it's tempting to make this simple: hometown hero versus billionaire. The record is more interesting. Stadium owners used a veto. A promoter enforced it. Fellow musicians walked. And the man they pushed off the stage found other rooms to fill.", "Dublin is next. The microphone is his again, and so is everything that comes with it."], "sources": [{"outlet": "The FADER", "title": "Macklemore alleges stadium owners pressured Ed Sheeran", "date": "Sep 14, 2026", "url": "https://www.thefader.com/2026/09/14/macklemore-alleges-stadium-owners-pressured-ed-sheeran-to-take-him-off-tour"}, {"outlet": "TheWrap", "title": "Ed Sheeran tour fallout: Finneas, Aaron Rowe leave", "date": "Sep 15, 2026", "url": "https://www.thewrap.com/creative-content/music/ed-sheeran-tour-fallout-finneas-aaron-rowe-macklemore/"}, {"outlet": "ABC News Australia", "title": "Macklemore's pro-Palestine song Hind's Hall", "date": "May 8, 2024", "url": "https://www.abc.net.au/news/2024-05-08/macklemore-pro-palestine-song-hinds-hall-internet-reacts/103820958"}, {"outlet": "The Guardian", "title": "Macklemore releases song backing campus protests", "date": "May 7, 2024", "url": "https://www.theguardian.com/music/article/2024/may/07/biden-us-rapper-macklemore-palestine-campus-protests"}, {"outlet": "FOX 13 Seattle", "title": "Macklemore responds to backlash", "date": "Sep 25, 2024", "url": "https://www.fox13seattle.com/news/macklemore-responds-f-bomb-backlash"}, {"outlet": "TheWrap", "title": "Calls for Macklemore's removal from Sheeran tour", "date": "Sep 6, 2026", "url": "https://www.thewrap.com/creative-content/music/macklemore-removal-ed-sheeran-tour/"}, {"outlet": "GBH", "title": "Bob Kraft explains decision", "date": "Sep 14, 2026", "url": "https://www.wgbh.org/news/politics/2026-09-14/bob-kraft-explains-decision-to-urge-ouster-of-rapper-macklemore-from-ed-sheeran-tour"}, {"outlet": "The Guardian", "title": "Macklemore dropped from Ed Sheeran tour", "date": "Sep 14, 2026", "url": "https://www.theguardian.com/music/2026/sep/14/macklemore-dropped-ed-sheeran-tour-free-palestine"}, {"outlet": "Stereogum", "title": "Pink responds to backlash", "date": "Sep 11, 2026", "url": "https://stereogum.com/2511217/pink-responds-to-backlash-over-sharing-anti-macklemore-post-about-israel/news"}, {"outlet": "The Wall Street Journal", "title": "The 40-minute phone call that left Ed Sheeran's tour hanging by a thread", "date": "Sep 2026", "url": "https://www.wsj.com/arts-culture/music/the-40-minute-phone-call-that-left-ed-sheerans-tour-hanging-by-a-thread-99e07984"}, {"outlet": "Reuters", "title": "Macklemore dropped from Ed Sheeran's US tour", "date": "Sep 14, 2026", "url": "https://www.reuters.com/business/media-telecom/macklemore-dropped-ed-sheerans-us-tour-after-free-palestine-remarks-2026-09-14/"}, {"outlet": "Front Office Sports", "title": "Robert Kraft confirms he blocked Macklemore", "date": "Sep 2026", "url": "https://frontofficesports.com/article/robert-kraft-confirms-he-blocked-macklemore-from-gillette-shows/"}, {"outlet": "TheWrap", "title": "Ed Sheeran explains why Macklemore was dropped", "date": "Sep 15, 2026", "url": "https://www.thewrap.com/creative-content/music/ed-sheeran-explains-why-macklemore-dropped-israel-palestine-politics/"}, {"outlet": "Pitchfork", "title": "Macklemore will donate Ed Sheeran tour earnings", "date": "Sep 16, 2026", "url": "https://pitchfork.com/story/macklemore-will-donate-ed-sheeran-tour-earnings-to-palestine/"}, {"outlet": "TheWrap", "title": "Macklemore donates $1 million, challenges Kraft", "date": "Sep 16, 2026", "url": "https://www.thewrap.com/creative-content/music/macklemore-donates-1-million-from-ed-sheeran-tour-robert-kraft/"}, {"outlet": "KIRO 7", "title": "Robert Kraft responds to Macklemore's $1M pledge", "date": "Sep 18, 2026", "url": "https://www.kiro7.com/news/local/robert-kraft-responds-macklemores-1m-palestine-pledge-says-ed-sheeran-asked-him-commit-2m/G6YZOI22EVBPFA4WD7S6PFOI4Q/"}, {"outlet": "TheWrap", "title": "Ms. Rachel matches Macklemore's $1 million", "date": "Sep 17, 2026", "url": "https://www.thewrap.com/culture-lifestyle/culture/ms-rachel-matches-macklemore-1-million-donation-palestine/"}, {"outlet": "Associated Press", "title": "Sheeran in Philadelphia", "date": "Sep 19, 2026", "url": "https://apnews.com/article/d452b6eadff285553b20c558191886bb"}, {"outlet": "iHeartRadio", "title": "Ed Sheeran apologizes to fans on stage", "date": "Sep 2026", "url": "https://www.iheartradio.ca/en/music-news/ed-sheeran-apologizes-to-fans-on-stage-calls-situation-in-catastrophic-and-unjustifiable/"}, {"outlet": "WJAR", "title": "Ed Sheeran Gillette concerts canceled for nor'easter", "date": "Sep 25, 2026", "url": "https://turnto10.com/news/local/ed-sheeran-concerts-at-gillette-stadium-have-been-cancelled-due-to-noreaster-sept-10-2026"}, {"outlet": "Page Six", "title": "Zach Bryan wears Free Palestine shirt at Gillette", "date": "Oct 3, 2026", "url": "https://pagesix.com/2026/10/03/celebrity-news/zach-bryan-wears-free-palestine-shirt-during-concert-at-robert-krafts-gillette-stadium-after-macklemore-controversy/"}, {"outlet": "Digital Music News", "title": "Ed Sheeran tour adds new opening acts", "date": "Oct 11, 2026", "url": "https://www.digitalmusicnews.com/2026/10/11/ed-sheeran-loop-tour-new-opening-acts/"}, {"outlet": "Associated Press", "title": "Macklemore announces Free Palestine Tour", "date": "Sep 24, 2026", "url": "https://apnews.com/article/65a65a362e530dfe739ddb626dc16d23"}, {"outlet": "Macklemore", "title": "Free Palestine Tour (official)", "date": "", "url": "https://macklemore.com/free-palestine-tour/"}, {"outlet": "TMZ", "title": "Macklemore Free Palestine Tour sold out", "date": "Sep 30, 2026", "url": "https://www.tmz.com/2026/09/30/macklemore-free-palestine-tour-sold-out/"}, {"outlet": "Consequence", "title": "Macklemore Free Palestine Tour beneficiaries", "date": "Sep 24, 2026", "url": "https://concerts.consequence.net/articles/macklemore-free-palestine-tour"}, {"outlet": "The Jewish Chronicle", "title": "Free Palestine Tour beneficiary criticism", "date": "Oct 16, 2026", "url": "https://www.thejc.com/news/uk/macklemores-free-palestine-tour-raising-money-for-group-which-justified-october-7-hostage-taking-se094hfn"}, {"outlet": "Blue Square Alliance Against Hate", "title": "About", "date": "", "url": "https://www.bluesquarealliance.org/about-bsa/"}]}, {"slug": "homeless-by-choice", "topic": "streets", "date": "2026-10-18", "title": "Homeless by Choice", "dek": "You're 23, no car, no loans, a job you hate. Seattle will feed you, wash you, insure you and, if you get in, house you for free. We ran the numbers on quitting. Here's the bill.", "body": ["Every Seattle office worker has had the thought. You're on the bus at 7:40 a.m., your rent just went up again, and some guy stretched out in a doorway on Third looks like he's winning. What if he's the smart one?", "So let's take the thought seriously. Picture a 23-year-old who never went to college, owes nobody, drives nothing, and spends 40 hours a week at a job that's slowly eating them. Could they just walk away and live on what this city gives out for free?", "The answer is more interesting than either side wants it to be.", "## Breakfast is handled", "Start in Ballard. Edible Hope Kitchen serves a free breakfast every weekday from 8 to 10 in the basement of St. Paul's United Church of Christ, on 12th Ave NW. Friday is pancakes and eggs. Other days it's curry, meatloaf, sometimes salmon. No sign-up, no sermon, no bill.", "Down the hill, the Ballard Food Bank hands out groceries and bags built for people with no stove, and runs a Kindness Café Monday through Thursday. Sunday night there's a free dinner at Ballard First Lutheran. On Capitol Hill, Community Lunch serves weekday breakfast and lunch to anyone who walks in, plus coats, socks and sleeping bags.", "Showers and laundry? Urban Rest Stop does both, free, with towels, soap and detergent thrown in. Internet? The Seattle Public Library gives you free Wi-Fi whenever it’s open and two hours a day on a computer with a card. A church on a Sunday morning, if that's your thing.", "None of this is one place that does everything. It's a patchwork with opening hours. But stitched together, it covers a surprising amount of a normal life.", "#T {\"title\":\"The free city, by the numbers\",\"head\":[\"Need\",\"Where\",\"The catch\"],\"rows\":[[\"Breakfast\",\"Edible Hope Kitchen, weekdays 8–10 a.m.\",\"Weekdays only\"],[\"Groceries, no-cook food\",\"Ballard Food Bank, 1400 NW Leary Way\",\"Café open Mon–Thu\"],[\"Sunday dinner\",\"Ballard First Lutheran, 5–6 p.m.\",\"One night a week\"],[\"Showers, laundry\",\"Urban Rest Stop\",\"Laundry every other day\"],[\"Internet\",\"Seattle Public Library\",\"Opening hours, time limits\"],[\"Doctor, therapist\",\"Apple Health (Medicaid)\",\"You have to qualify and enroll\"]],\"note\":\"Schedules checked Oct. 18, 2026. Programs change; check before you go.\"}", "## The roof is the hard part", "Free shelter exists, and some of it is better than you'd think. SHARE/WHEEL's Tent City 3 and Tent City 4 charge nothing, have no set limit on how long you can stay, and run themselves: residents set the rules, pull security shifts, and get hot dinners from volunteers most nights, plus bus tickets.", "A step up is a tiny-house village. The Low Income Housing Institute's units have a locking door, a bed, heat, electricity and storage, with shared kitchens and bathrooms. Nickelsville runs self-managed villages too. Listings say no fees.", "Here's the catch nobody puts on the brochure: you have to get in. LIHI takes referrals through outreach workers and requires case management. Nickelsville runs interviews and a waitlist. And the demand is enormous. King County counted 18,365 people experiencing homelessness this year, 11,829 of them without shelter, up 9 percent from 2024.", "Then there's the park. Rent there is zero too, but camping in Seattle parks is generally illegal. You get no lock, no heat, no neighbors watching your stuff, and no guarantee you'll be allowed to stay the night.", "So, three places with the same rent, $0, and wildly different lives. That's the whole story in one line.", "## Run the receipts", "Here's the math, honestly. Two workers paying normal Seattle costs: one living alone, one splitting a place. Then our dropout, assuming they've already landed a free bed, signed up for benefits and eat from the free network. No car anywhere. No debt anywhere.", "#T {\"title\":\"Monthly cash out of pocket\",\"head\":[\"\",\"Worker, own place\",\"Worker, roommate\",\"Free shelter + services\"],\"rows\":[[\"Rent and utilities\",\"$2,132\",\"$1,090\",\"$0\"],[\"Food\",\"$436\",\"$436\",\"$0\"],[\"Health care\",\"$253\",\"$253\",\"$0\"],[\"Transit\",\"$108\",\"$108\",\"$36\"],[\"Phone and internet\",\"$100\",\"$65\",\"$0\"],[\"Clothes, laundry, toiletries\",\"$75\",\"$75\",\"$0\"],[\"Renters insurance\",\"$15\",\"$15\",\"$0\"],[\"Monthly total\",\"$3,119\",\"$2,042\",\"$36\"],[\"Per year\",\"$37,428\",\"$24,504\",\"$432\"]],\"note\":\"Rent, food and health figures for a single adult come from MIT's King County living-wage benchmarks. The roommate rent and small items are our assumptions. Transit is a full-price Metro pass, or a $36 ORCA LIFT pass for low-income riders. The third column only works if every condition is met.\"}", "Thirty-six dollars a month. That number is real, and it's why the thought won't go away.", "But look at what it's hiding. The worker paying $2,042 a month is also earning. Give our roommate an illustrative $3,200 a month after tax and they clear about $1,158 after bills. Our dropout clears nothing, because there's nothing coming in. Skipping rent isn't the same as saving money. You've traded a paycheck for your time. For some people that's a great trade. It's still a trade.", "And the worker could cheat too. Housed people can eat at Community Lunch and use the library. Push the roommate onto the same free network and their bill drops to about $1,466 a month.", "## The paper route", "There's a third option the shouting match usually misses: no rent, and a little income. Real Change vendors buy each paper for $1.25 and sell it for $4, plus tips. That's $2.75 a copy, and you set your own hours, with no boss and no performance review.", "#T {\"title\":\"What a Real Change vendor could make\",\"head\":[\"Papers a month\",\"Sales\",\"Cost of papers\",\"Left over\"],\"rows\":[[\"100\",\"$400\",\"$125\",\"$275\"],[\"200\",\"$800\",\"$250\",\"$550\"],[\"400\",\"$1,600\",\"$500\",\"$1,100\"]],\"note\":\"Our math, assuming every paper sells at cover price. Before tips, taxes, bus fare and unsold copies. Not a promise of what anyone earns.\"}", "Sell 200 papers and you've got about $500 a month of walking-around money on a $0 rent bill. On paper, that's the most livable version of the whole plan. Whether you can actually sell 200 papers a month, nobody publishes.", "## The free stuff has strings", "The benefits are real. They're also not forever, and they're not automatic.", "Washington's food stamps, called Basic Food, max out at $306 a month for one person. But able-bodied adults without kids now face time limits statewide unless they work or train about 80 hours a month, or put in Workfare hours. Quit a job without good cause and you can be sanctioned too. \"Quit and live on EBT forever\" isn't how the rules work.", "Health care is the big one. Apple Health covers doctors and mental health for eligible low-income adults at no cost to you, which kills the old argument that you have to stay at a job you hate for the insurance. But starting January 2027, the state says many adults on Apple Health will face new work or community-service requirements and renewals every six months. The free ride has a clock on it.", "## What it does to you", "Your body notices where you sleep. A heated tiny house and a wet sidewalk are not the same life with the same rent. A national study tracking about 140,000 people counted as homeless in the 2010 Census found that those under 65 died at roughly three and a half times the rate of housed people. That's a broad population, not a prediction about one healthy 23-year-old in a village. But it's not nothing.", "The office isn't a spa either. The World Health Organization says decent work gives people purpose, routine and connection, and that bad work with crushing demands, bullying and no control wrecks mental health. If your job is the second kind, wanting out is sane.", "Just know that the free life has a schedule too. Breakfast ends at 10. Laundry runs about an hour and a half a load. Camps have chores and meetings. You trade a boss for a calendar of serving windows.", "## The part money can't measure", "The best case for this life isn't financial. It's people.", "In a 2023 podcast recorded inside Tent City 3, one resident called the camp \"the family that I got to pick.\" Researchers who studied the camp from 2012 to 2025 found that its shared chores and resident-run rules gave people real connection and a sense of control. Showing up for a security shift, sharing dinner, being trusted by your neighbors: that's a kind of worth no paycheck hands out.", "Of course you don't have to be homeless to have any of that. Housed people volunteer, worship and build community too, if their jobs leave them the energy.", "## So, is it a career?", "As a way to live on almost no cash, yes, under the right conditions: you're healthy, you get into a good village, your benefits hold, and you keep a little income on the side. Seattle really has built a city where the basics can cost zero.", "As a plan, it's shakier. Beds are scarce, rules are tightening, and the safety net gets thinner the moment you lean on it hardest. Walk out of your apartment assuming a tiny house is waiting and you may find a waitlist and a park.", "And calling it \"homeless by choice\" lumps together people who got evicted, people who turned down a bad shelter, people who love their camp and people who just can't do another year of a soul-killing job. Those aren't the same decision.", "Here's what the numbers really show. Strip away rent and the basics of a life cost almost nothing in this city. What costs so much is the roof. If the best deal a 23-year-old can find is a job whose main reward is being allowed to stay indoors, that says less about the 23-year-old than it does about Seattle."], "sources": [{"outlet": "Edible Hope Kitchen", "title": "Our Services", "date": "Current operator listing", "url": "https://www.ediblehopekitchen.org/our-services"}, {"outlet": "Ballard Food Bank", "title": "Services and location", "date": "Current operator listing", "url": "https://www.ballardfoodbank.org/"}, {"outlet": "Ballard Food Bank", "title": "Service Schedule", "date": "2026 schedule", "url": "https://ballard-food-bank.squarespace.com/service-schedule"}, {"outlet": "Urban Rest Stop / LIHI", "title": "Urban Rest Stops and FAQ", "date": "Current operator listing", "url": "https://www.lihihousing.org/urbanreststops"}, {"outlet": "Seattle Public Library", "title": "Computers & Equipment", "date": "Current library policy", "url": "https://www.spl.org/using-the-library/reservations-and-requests/reserve-a-computer/computers-and-equipment"}, {"outlet": "St. Luke's Episcopal Church", "title": "Welcome and worship", "date": "Current church listing", "url": "https://stlukesseattle.org/"}, {"outlet": "Washington 211", "title": "Tent City 3 Seattle", "date": "Current detailed listing", "url": "https://search.wa211.org/search/05139b1d-a1f2-572d-8211-db853e0966a2"}, {"outlet": "SHARE/WHEEL", "title": "Tent Cities", "date": "Current operator listing", "url": "https://www.sharewheel.org/welcome-to-share-wheel/tent-cities"}, {"outlet": "Washington 211", "title": "Nickelsville Northlake", "date": "Current detailed listing", "url": "https://search.wa211.org/search/ce4bccf0-a4b9-5b0c-b98e-0a4153935a1e"}, {"outlet": "Nickelsville", "title": "How to Apply", "date": "Current operator procedure", "url": "https://www.nickelsville.org/how-to-apply"}, {"outlet": "Low Income Housing Institute", "title": "Tiny House Villages FAQ", "date": "Current operator information", "url": "https://www.lihihousing.org/faq?appDefId=14c92d28-031e-7910-c9a8-a670011e062d&categoryId=3e687d86-0b34-4598-9e79-748daf463ca3"}, {"outlet": "Low Income Housing Institute", "title": "Getting Connected to Services FAQ", "date": "Current operator information", "url": "https://www.lihihousing.org/faq?appDefId=14c92d28-031e-7910-c9a8-a670011e062d&categoryId=7cef0bf5-5440-42d2-b6bb-275647910050"}, {"outlet": "Washington Health Care Authority", "title": "Health care for adults", "date": "Current eligibility guidance", "url": "https://www.hca.wa.gov/free-or-low-cost-health-care/i-help-others-apply-and-access-apple-health/health-care-adults"}, {"outlet": "Washington Health Care Authority", "title": "What are my basic covered services?", "date": "Current coverage guidance", "url": "https://www.hca.wa.gov/free-or-low-cost-health-care/i-need-medical-dental-or-vision-care/what-are-my-basic-covered-services"}, {"outlet": "Washington Health Care Authority", "title": "Changes to Apple Health (Medicaid)", "date": "2026 guidance for prospective changes", "url": "https://www.hca.wa.gov/free-or-low-cost-health-care/changes-apple-health-medicaid"}, {"outlet": "U.S. Department of Agriculture", "title": "SNAP Cost-of-Living Adjustment Information", "date": "Updated October 13, 2026; FY2027", "url": "https://fns-prod.azureedge.us/snap/allotment/cola"}, {"outlet": "Washington DSHS", "title": "Able-Bodied Adults Without Dependents", "date": "Current rules; statewide application from February 1, 2026", "url": "https://www.dshs.wa.gov/family-food-and-housing-services/food-assistance/able-bodied-adults-without-dependents"}, {"outlet": "King County Metro", "title": "ORCA LIFT", "date": "Current fare listing", "url": "https://kingcounty.gov/en/dept/metro/fares-and-payment/reduced-fares/orca-lift"}, {"outlet": "King County Metro", "title": "Subsidized annual pass", "date": "Current eligibility listing", "url": "https://kingcounty.gov/en/dept/metro/fares-and-payment/reduced-fares/subsidized-annual-pass"}, {"outlet": "MIT Living Wage Calculator", "title": "King County, Washington", "date": "Updated February 15, 2026", "url": "https://livingwage.mit.edu/counties/53033"}, {"outlet": "King County Regional Homelessness Authority", "title": "2026 Point-in-Time Count Initial Report", "date": "June 23, 2026", "url": "https://kcrha.org/news-2026-point-in-time-pit-count-initial-report/"}, {"outlet": "World Health Organization", "title": "Mental health at work", "date": "September 15, 2026", "url": "https://www.who.int/news-room/fact-sheets/detail/mental-health-at-work"}, {"outlet": "Bruce Meyer, Angela Wyse and Ilina Logani / Becker Friedman Institute", "title": "Life and Death at the Margins of Society", "date": "Working paper, March 2023", "url": "https://bfi.uchicago.edu/working-paper/2023-41/"}, {"outlet": "Karen A. Snedker, Jennifer McKinney and Steven Pfaff", "title": "Self-governance, social order and institutional solutions to collective action in a tent city", "date": "Rationality and Society; June 25, 2026", "url": "https://doi.org/10.1177/10434631261464114"}, {"outlet": "You Know Me Now / Rex Hohlbein and Tomasz Biernacki", "title": "Episode 12: Inside view of Tent City 3", "date": "Visit documented January 2023", "url": "https://www.youknowmenow.com/youknowmenowpod/9pb5d7q1mex0ozyiya6d53kslbh6tt-j77gr-726gm-p2f6z-nh95l-5whb4-yhn44-8srey-jyc5m-bbpen"}, {"outlet": "Federal Reserve Bank of New York", "title": "Quarterly Report on Household Debt and Credit, Q2 2026 release", "date": "August 11, 2026", "url": "https://www.newyorkfed.org/newsevents/news/research/2026/20260811"}, {"outlet": "Federal Student Aid", "title": "Income-Driven Repayment FAQs", "date": "Current repayment guidance", "url": "https://studentaid.gov/articles/faqs-idr-plan/"}, {"outlet": "Sustainable Ballard", "title": "Meals with Neighbors / Ballard Sunday Dinner", "date": "Current program listing", "url": "https://www.sustainableballard.org/ballard-sunday-dinner/"}, {"outlet": "Washington DSHS", "title": "200 Series Reason Code Protocols", "date": "Current administrative guidance", "url": "https://www.dshs.wa.gov/200-series-reason-code-protocols"}, {"outlet": "Community Lunch on Capitol Hill", "title": "FAQs", "date": "Current operator listing", "url": "https://www.communitylunch.org/about-1"}, {"outlet": "King County Metro", "title": "Prices", "date": "Current fare listing", "url": "https://kingcounty.gov/en/dept/metro/fares-and-payment/prices"}, {"outlet": "Seattle Parks and Recreation", "title": "Rules & Regulations", "date": "Current city guidance", "url": "https://www.seattle.gov/parks/about-us/rules-and-regulations"}, {"outlet": "Real Change", "title": "Organization profile and vendor program description", "date": "Current publisher profile accessed October 18, 2026", "url": "https://jp.linkedin.com/company/real-change-homeless-empowerment-project"}], "minutes": 7}, {"slug": "we-turned-our-lights-off", "topic": "surveillance", "date": "2026-10-14", "title": "“We Turned Our Lights Off”", "dek": "A father of three died after an attempted ICE stop in Grand Rapids. Police records put an agent’s 911 call 49 seconds after his car hit the curb. Now the question is what the government can prove about everything that came before.", "body": ["The call came after the car was already burning.", "On the line was an Immigration and Customs Enforcement agent, talking to a Grand Rapids dispatcher. When the recording was released to Michigan Public, her name would be redacted. She described an attempted vehicle stop. A driver who would not yield. And a decision about the emergency lights: “we turned our lights off.” Asked why officers had initiated the stop, she said she would have to ask her partner. [1]", "The man in the wreck was Mario David Coronado Juarez, a Guatemalan construction worker and father of three. He died on September 20, 2026, after his vehicle struck a tree on the city’s southwest side. The Department of Homeland Security says its agents had already discontinued their enforcement action before the crash, then came back to help when they spotted smoke. Michigan State Police are investigating. [3,7,8]", "Between the agent’s words and the department’s, there is a gap, and nearly everything that matters lives inside it. Where the federal vehicles were. Why anyone tried to stop the car. What the agents said to each other. The moment a driver’s flight became a fatal crash. Switching off emergency lights is an action. Whether the officers actually let him go is a question only a full reconstruction can answer.", "On October 15, WOOD-TV reported something sharper than any of the early accounts: police records put the ICE agent’s 911 call 49 seconds after Coronado Juarez’s vehicle hit the curb. [2]", "Forty-nine seconds. On its own, that number is not proof of an unlawful pursuit. It is a reason to demand the whole sequence, with the clocks checked and every vehicle accounted for. When the government offers an explanation, it should be one the evidence can test.", "## A life lived across a border", "His wife described a routine that crossed an international border every day. He worked in Michigan. He called home. He sent money to Guatemala. Their daughters were 13 and 11; their son was seven. On the Sunday he died, the call did not come. FOX 17’s interview with her describes a family trying to make sense of an absence before they understood it was a death. [4]", "When WOOD-TV reported on his room after the crash, it found the ordinary evidence of a working life: a Bible, footwear for church, tools, a soccer identification card. He installed drywall. He played in a local Hispanic league. Family friend Karla Barberi said he hoped to help build a house and, eventually, open a small grocery business. The things he left behind were being sorted, some for disposal, some for shipment home. [5]", "At a September 24 vigil, Barberi described a man whose earnings held up a household far away. Michigan Public reported flowers carried to the damaged tree and a family photograph displayed beneath it. The people mourning him were also trying to pay for his return to Guatemala. [6]", "None of this settles what happened on the road, and it doesn’t need to. These details measure the loss. A person’s worth is not determined by whether every decision in his final minute was defensible.", "> A person’s worth is not determined by whether every decision in his final minute was defensible.", "## Forty-nine seconds", "WOOD-TV’s account of Grand Rapids police reports traces the route. The following began near Sutton Street SW and ran more than 1.5 miles before the attempted stop near Hall and Century. At 7:07 a.m., surveillance near Shamrock and Century showed comparatively ordinary driving. At 7:08, footage near Burton showed the vehicle hitting a curb and going airborne. Police estimated its speed at 96–105 mph. Forty-nine seconds after the curb came the emergency call. [2]", "That is as precise as the public record gets. The published account doesn’t give a verified second for the attempted stop. It doesn’t give a synchronized, second-by-second position for each federal vehicle, or the full underlying reconstruction. Those gaps matter: separate cameras and dispatch systems keep separate clocks, and nobody should simply assume they agree.", "DHS tells it this way. Officers were looking for the vehicle’s registered owner, a person the department associated with alcohol-related driving offenses and described as wanted in Guatemala. Coronado Juarez was not that person. According to the department, he accelerated away; agents immediately discontinued the action for public safety, later saw smoke nearly half a mile away, and attempted a rescue and tried to suppress the fire. [3,6]", "DHS also says Coronado Juarez had been removed from the United States in 2021 and later returned. That is a claim about his immigration history. It doesn’t tell anyone what agents knew about the driver when they activated their lights. [3]", "That matters. An explanation built on who owns a car has to be measured against what officers knew about who was driving it. Facts learned after a man dies can’t quietly become the justification that supposedly existed before.", "The caller’s failure to explain the stop is just as limited as evidence. It shows she gave the dispatcher no substantive reason in that exchange. It does not show her partner had none. Her account and DHS’s later statement have to be checked against operational records, not treated as two versions of the same testimony.", "The recording also captures uncertainty about whether anyone else was inside the mangled vehicle. That is what an emergency call is: a report made in the moment, amid incomplete information. It can preserve important admissions and observations without seeing everything. And because the caller’s identity is redacted, the released audio alone can’t tell listeners exactly what her role was. [1]", "## What backing off would have to mean", "Federal regulations draw lines between questioning, brief detention, arrest and vehicular pursuit. Under 8 C.F.R. § 287.8(b)(2), a brief detention requires reasonable suspicion grounded in specific, articulable facts. The regulation separately defines a vehicular pursuit as an active attempt to apprehend fleeing suspects, and it identifies authorized officers and designated pursuit vehicles. [10]", "So the legal question isn’t just whether someone can produce a warrant. A brief investigative detention doesn’t always require one. Investigators still have to establish the actual basis for the attempted stop, the authority being exercised and what officers did next.", "On pursuit, a serious reconstruction would lay vehicle-location data, radio traffic and surveillance against the applicable policy. Did officers brake, pull over, turn away, or keep going in the same direction? How far behind were they? Did every participating vehicle disengage? Was a supervisor notified? These are open investigative questions, not allegations that any particular maneuver happened.", "The driver’s reported speed belongs in that reconstruction too. Leaving out dangerous driving doesn’t make a fatal encounter easier to understand. Documenting it doesn’t erase the need to examine the enforcement decisions that came before.", "Untangled, there are four questions: what physically caused the collision; whether officers followed policy; whether their conduct added to the danger; and whether anything they did creates legal liability. Each one needs evidence. A single sentence about switching off lights can’t answer all four.", "## The paper chase", "On September 22, Representative Hillary Scholten wrote to acting ICE director David Venturella, and her questions were unusually concrete. What was the reason for the stop? Was there a warrant, a removal order, an investigation? How many agents, how many vehicles? Did lights and sirens stay on? What did officers do to make clear the stop had ended? She asked that camera footage and incident reports be preserved, and requested a briefing and a written response by September 27. [9]", "Questions like those mark the difference between an assurance and an account someone can audit. If cameras were available, were they turned on? If recordings exist, who has them? If there are none, why not? Nothing in the materials reviewed for this story shows a complete public response to Scholten’s questions.", "Grand Rapids officials have said their police were not part of the attempted stop. Mayor David LaGrand’s September 24 statement described the decision by city leadership, including Police Chief Joseph Trigg, to seek state-police assistance. Governor Gretchen Whitmer directed an independent review of law-enforcement actions alongside the local crash investigation. [7,8]", "LaGrand also set the death inside a national climate of fear. That is the mayor’s political assessment, not a forensic finding. His institutional demand, for cameras, oversight and more transparency, is something the public can weigh now, even while the crash investigation is unfinished. [7]", "Michigan Public got the emergency audio through a records request. WOOD-TV got the police reports. Neither outlet’s published work substitutes for the full investigative file. Together, they show why releasing contemporaneous records matters: once they’re out, people can start asking questions anchored in evidence instead of refereeing competing descriptions. [1,2]", "The urgent practical issue is preservation. Investigators need the original files, their metadata and a record of every edit or redaction. A short clip passed around online can cut off the approach or the departure; a transcript can lose background sound. A useful release would explain what has been withheld and why, and separate evidence that is missing from evidence that exists but hasn’t been made public. None of those categories, on its own, means a cover-up. Leaving them unexplained makes independent scrutiny harder.", "## Another father, another state", "In Biddeford, Maine, on July 13, the encounter ended in gunfire. Johan Sebastián Durán Guerrero, a Colombian father, was killed during an ICE operation. His partner, Martha Karolina Rojas Alvarez, later described how attached their three-year-old daughter was to him. Family attorney Benjamin Gideon said Durán Guerrero had work authorization and was pursuing a lawful immigration process. [11]", "Maine’s attorney general opened an investigation that same day. The office’s initial statement relayed an account that the driver fled toward an officer during an operation connected with a final removal order. Crucially, it presented that account as preliminary information, not an adjudicated finding. [12]", "On August 17, Attorney General Aaron Frey said his office was still collecting and analyzing evidence to determine whether Maine law supported legal action. He drew a line between that job and general oversight of DHS practices, which his office could not exercise. [13]", "According to The Boston Globe, the daughter was home. Her bullet-damaged car seat remained with investigators, family attorney Sean P. Murphy said. [14]", "What happened to a family and how the law classifies a shooting are separate matters. The family’s demand for prosecution deserves accurate reporting; a murder finding requires a legal process. And an agency’s invocation of public safety doesn’t establish that lethal force was justified.", "Durán Guerrero’s killing can’t prove what happened to Coronado Juarez. What it exposes is the same accountability problem in a different shape: families and state officials trying to establish what a federal operation did, while the federal government controls important parts of the record.", "## Seven rounds in Manhattan, a broken leg in Houston", "October 8, around 4 p.m., Manhattan’s Marble Hill neighborhood: an ICE officer shot Oscar Belgal, 28. NYPD Commissioner Jessica Tisch said evidence indicated at least one officer fired seven rounds. Belgal was wounded in the neck. His five-year-old son, in the back seat, was physically unharmed. [16]", "DHS alleged that Belgal used his vehicle against officers’ vehicles. Surveillance described by ABC News showed armed plainclothes officers approaching, a window being broken and Belgal driving away. It did not capture the shooting itself. DHS Secretary Markwayne Mullin said federal body cameras were recording, but at that briefing he did not commit to releasing the footage. [15]", "What the public video leaves out is part of the evidence. Footage that doesn’t show the alleged threat isn’t automatically footage that disproves a threat outside its frame. It is a reason to go after the other cameras, the damage assessments and the witness accounts.", "Two days later, an ICE vehicle struck Miguel Parra-Hernandez during an operation in the Houston area. The Harris County sheriff’s initial account placed the incident around 7:20 a.m. on Clay Road. The construction worker suffered a broken leg. ICE said he ran in front of its vehicle. [17]", "District Attorney Sean Teare publicly disputed that account, saying the available video indicated an intentional strike, and his office was evaluating possible criminal charges. That was a prosecutor’s assessment in the middle of an investigation, not a conviction. ICE denied intentional wrongdoing. [18]", "Then the identification behind the operation came under scrutiny. ICE named its intended target as Jose Mendoza-Cervantes. By October 16, the district attorney’s spokesperson told AP that person was not in the vehicle. Relatives and the advocacy group FIEL said the photograph ICE circulated actually depicted Jose Hector Jimenez, who had died years earlier, and said a death certificate had been supplied to investigators. [20]", "Claims like that require the underlying identity records, not a viral side-by-side. KPRC reported that prosecutors were also examining how evidence from the collision was handled. On October 16, ICE confirmed the officer was on administrative leave during an internal investigation, describing leave as standard procedure. [19,21]", "Four locations. A burning vehicle, a fatal shooting, a wounded driver, a man with a shattered leg. The circumstances differ. The question that keeps coming back is how the government identifies a target, starts an encounter and accounts for what happens next.", "## Every number needs a label", "ABC News’s September 24 accounting identified at least 21 people shot by federal immigration agents during President Donald Trump’s second term. Eight of those shootings were fatal, including the deaths of three U.S. citizens. ABC separately identified at least 15 incidents in which agents fired without injuring anyone. Those are dated reporting totals, not a national census as of October 18. [23]", "Coronado Juarez’s death falls in a different category: a fatal crash following an attempted stop. Deaths in detention need yet another definition. Lump those categories together without examining individual cases and you risk both leaving deaths out and counting some twice.", "UCLA Law’s Behind Bars Data Project reports 31 deaths in detention during calendar 2025, excluding deaths during arrests or before booking into a facility. Its dashboard, updated in October, displayed death records through September 18. That coverage date matters more than how current the page looks. [25]", "A JAMA study offers a better measure of changing risk than raw totals alone. It reported 47.5 deaths per 100,000 person-years in fiscal 2025, and an annualized 88.9 for October 1, 2025–January 19, 2026. That second figure is an estimate drawn from part of a fiscal year, not a full-year death count. Its 95 percent confidence interval ran from 49.4 to 133.4. [24]", "Human Rights Watch and Physicians for Human Rights, using a broader accounting, reported 52 deaths in ICE custody from January 20, 2025, through June 4, 2026. Their categories included deaths during some enforcement encounters as well as detention-related deaths. That figure cannot simply be added to ABC’s shooting total. [26]", "A current national detention total requires a dated, reconciled list, and nothing reviewed for this story supplies one through October 18. Careful counting strengthens the case for scrutiny. An unreliable total hands officials an easy way to argue about arithmetic instead of people.", "Even the edges of the count are contested. In June, AP reported that ICE had rescinded a policy requiring reporting and investigation of deaths within 30 days after release. A death can now occur soon after detention and fall outside the agency’s reporting obligation, without settling whether custody contributed to it. That makes the line between dying in custody and dying after custody especially important. [36]", "## Cameras on paper", "On October 14, the same day Michigan Public published the Grand Rapids recording, the Government Accountability Office publicly released an audit of federal immigration agencies’ body-camera programs. GAO found outdated plans, inadequate measures of results and gaps in operational guidance. [27]", "Its report counted approximately 4,800 cameras deployed by ICE as of April and approximately 11,500 by Customs and Border Protection as of June. Those figures describe deployment on particular dates; they don’t establish whether the Grand Rapids team had working cameras that morning. [27]", "GAO recommended additional controls, including automatic activation. DHS rejected that recommendation, citing inadvertent recordings and risks to sensitive interactions and privacy. GAO held its ground that better controls were needed, noting that CBP already used such mechanisms. [27]", "This is the difference between buying cameras and producing evidence. A camera has to be issued, worn, activated, uploaded and preserved. After that, public accountability depends on lawful access to the recording. A procurement announcement answers only part of that chain.", "## Closer to home", "For Seattle readers, the connection is concrete. The University of Washington Center for Human Rights documented 356 arrest incidents between August 1, 2025, and October 13, 2026, linked to federal queries of Washington licensing data through Nlets. Its method paired database-query records with evidence of particular arrests. [28]", "The report identifies four pathways for access: direct systems, interstate queries, commercial data brokers and information passed through local law enforcement. It argues that selective restrictions leave the other routes open. The governor’s office told KUOW it was limiting access for civil immigration enforcement while preserving legitimate public-safety uses and reviewing stronger warrant requirements. [28,29]", "The researchers’ total is not a count of distinct people convicted of crimes, and it doesn’t prove every federal database query unlawful. What it does establish is documented links between administrative records and enforcement encounters. A driver’s license can become a link in the chain that leads to a roadside stop.", "Washington also has a specifically documented federal shooting. Prosecutors said Border Patrol agents shot Nathaniel A. Muniz-Spry in the leg near Blaine on June 16 after an encounter involving a firearm and attempted flight. He survived and was charged with unlawful firearm possession. That account is a charging narrative, not a judicial finding that the shooting was justified. [30]", "Any sweeping assurance that nobody in Washington has died “at the hands of” immigration agents is harder to back up than that wording suggests. It requires defining agencies, custody, causation and dates, and nothing in this reporting establishes such a statewide absence. Separately, Washington’s attorney general has pursued access for health inspections at Tacoma’s privately operated immigration detention center. [31]", "## What the family is still owed", "The central question in Grand Rapids can, in principle, be answered: what did each officer know and do, and when? A complete account would reconcile the initial identification, the attempted stop, the withdrawal DHS describes, the crash and the response.", "It would say which facts came from recordings, which came from officers’ recollections and which remain uncertain. It would disclose the policies investigators applied and explain whether the conduct complied with them. If the evidence supports the officers’ account, the public should see that evidence. If it contradicts the account, the government owes a correction and whatever consequences the findings support.", "The public should also be told who makes those calls. An internal administrative review, a state criminal investigation and a civil claim answer different questions and can reach different conclusions. Announcing that an incident is under investigation tells a family very little unless the responsible authority, the scope and the eventual findings can be identified.", "For Coronado Juarez’s family, the consequences are already permanent. The earnings have stopped. The daily call has stopped. The work of explaining his death falls to people who were nowhere near that road.", "The government’s work is different. It has to account for the encounter its officers initiated. Turning off the lights cannot be the end of the story.", "#T {\"title\": \"Chronology\", \"head\": [\"When\", \"Where\", \"What happened\"], \"rows\": [[\"June 16, 2026\", \"Blaine\", \"Muniz-Spry wounded; federal firearm charge announced next day. [30]\"], [\"July 13, 2026\", \"Biddeford\", \"Durán Guerrero killed; Maine AG opens investigation. [12]\"], [\"August 17, 2026\", \"Maine AG\", \"Frey explains ongoing evidence review and limits of jurisdiction. [13]\"], [\"September 20 — before the stop\", \"Grand Rapids\", \"Following begins near Sutton Street; no verified clock here. [2]\"], [\"September 20 — 7:07 a.m.\", \"Grand Rapids\", \"Surveillance reference near Shamrock/Century. [2]\"], [\"September 20 — 7:08 a.m.\", \"Grand Rapids\", \"Curb impact near Burton. [2]\"], [\"Impact + 49 seconds\", \"Grand Rapids\", \"911 call, per WOOD’s police-record review. [2]\"], [\"September 22, 2026\", \"Congress\", \"Scholten sends oversight letter to Venturella. [9]\"], [\"By September 23, 2026\", \"Michigan\", \"Whitmer-directed state review publicly confirmed. [8]\"], [\"September 24, 2026\", \"DHS / Grand Rapids\", \"Federal non-pursuit account and mayoral statement; community vigil. [3,7,34]\"], [\"September 24, 2026\", \"National reporting\", \"ABC publishes its shooting count. [23]\"], [\"September 27, 2026\", \"Congressional deadline\", \"Requested response date; not proof that a response arrived. [9]\"], [\"October 8 — about 4 p.m.\", \"Marble Hill\", \"Belgal wounded in ICE shooting. [16]\"], [\"October 9, 2026\", \"New York / DHS\", \"Public video coverage and federal camera statement. [15]\"], [\"October 10 — about 7:20 a.m.\", \"Harris County\", \"Parra-Hernandez struck by ICE vehicle. [17]\"], [\"October 10, 2026\", \"Harris County\", \"County attorney supports independent local investigations. [22]\"], [\"October 13, 2026\", \"Washington\", \"UW publishes driver-data report. [28]\"], [\"October 14, 2026\", \"Grand Rapids / Washington, D.C.\", \"Michigan Public publishes audio report; GAO publicly releases camera audit. [1,27]\"], [\"October 15, 2026\", \"Grand Rapids\", \"WOOD publishes police-record chronology. [2]\"], [\"October 16, 2026\", \"Harris County\", \"ICE confirms administrative leave and internal review. [21]\"], [\"October 16–17, 2026\", \"Houston reporting\", \"Target-identity dispute develops; source records described by reporter. [20,37]\"], [\"October 18, 2026\", \"Research cutoff\", \"No final Grand Rapids investigative determination verified in the materials reviewed.\"]]}", "#T {\"title\": \"Claim check\", \"head\": [\"Claim\", \"Verdict\", \"Why\"], \"rows\": [[\"A fatal crash after an attempted ICE stop\", \"Supported\", \"Established across local reporting and the city’s statement. Exact legal causation remains unresolved. [3,7,35]\"], [\"ICE was actively chasing him at impact\", \"Unresolved / disputed\", \"DHS denies pursuit. Switching off lights alone does not supply a complete vehicle reconstruction. [3,10]\"], [\"The caller could not explain the stop\", \"Supported, with limits\", \"The exchange does not establish what other officers knew. [1]\"], [\"Coronado Juarez was the intended target\", \"Contradicted by DHS\", \"DHS identified the registered owner as its target. [3]\"], [\"A second-by-second official timeline is available\", \"Not established\", \"Minute references and one reported interval are available; synchronized original records were not reviewed.\"], [\"His exact age was 35 or 36\", \"Conflicting reporting\", \"Michigan Advance reports 35; FOX 17 and WOOD report 36. The feature avoids an unsupported choice. [4,34,35]\"], [\"His wife’s first name is Macedonia\", \"Needs confirmation\", \"The supplied draft uses Macedonia; FOX 17 prints Masadonia. The feature uses “his wife.” [4]\"], [\"The agent who called 911 is publicly identified\", \"Not established\", \"The published account says the released name is redacted. [1]\"], [\"The Biddeford killing is the latest fatal shooting nationally\", \"Not established through cutoff\", \"A comprehensive, current fatal-shooting census was not verified; the superlative is removed.\"], [\"Eight fatal shootings and three U.S. citizens\", \"Dated media count\", \"Retained as ABC’s September 24 accounting, not a new count conducted for this report. [23]\"], [\"Every incident involved ICE\", \"Incorrect as a generalization\", \"Border Patrol is part of CBP; identify the agency in each incident. [27,30]\"], [\"The Manhattan video proves the whole shooting sequence\", \"Incorrect\", \"The public camera did not capture the shooting itself. [15]\"], [\"The Houston collision was intentional\", \"Prosecutor’s allegation; disputed\", \"The reported assessment is attributed, with ICE’s denial and no invented verdict. [18,19]\"], [\"ICE definitively chased a dead man\", \"Identity dispute, not independently resolved here\", \"Family documents and the alias connection require careful attribution. [37]\"], [\"The Houston officer is on administrative leave\", \"Supported as of October 16\", \"ICE said this is standard procedure; leave is not a finding of guilt. [21]\"], [\"25 detention deaths in 2026 to date\", \"Not independently verified\", \"Removed; no reconciled October 18 national list was established.\"], [\"31 deaths in 2025\", \"Supported under a stated definition\", \"UCLA’s calendar-year detention measure excludes certain pre-booking and arrest deaths. [25]\"], [\"A 22-year-high mortality rate\", \"Do not repeat without reconciliation\", \"JAMA’s table gives 127.7 per 100,000 person-years in FY2004 versus 88.9 in partial FY2026. A blanket record-rate claim is inconsistent with that table. [24]\"], [\"No Washington deaths at the hands of immigration agents\", \"Not established\", \"An absence claim needs a defined population, cause and exhaustive search. It is omitted.\"], [\"The Blaine injury was an ICE shooting\", \"Agency correction\", \"DOJ identifies Border Patrol. The release does not adjudicate justification. [30]\"], [\"356 Washington arrests were all in 2026\", \"Date-range correction\", \"The primary UW study starts its interval in August 2025; use the primary source. [28,29]\"], [\"All driver-record searches were unlawful\", \"Overbroad\", \"Purpose, legal authority and actual use require case-specific examination; query totals are not illegality totals. [28,29]\"], [\"Video and audio are the only reason we know anything\", \"Overstatement\", \"The record also includes police reports, official statements, interviews and research.\"]]}", "#T {\"title\": \"People and roles\", \"head\": [\"Who\", \"Role\"], \"rows\": [[\"Mario David Coronado Juarez\", \"Grand Rapids driver who died; construction worker and father. [3,4,5,6]\"], [\"Karla Barberi\", \"Family friend and community advocate quoted by local reporters. [5,6,34]\"], [\"Hillary Scholten / David Venturella\", \"Member of Congress who sent the inquiry / acting ICE director addressed in it. [9]\"], [\"David LaGrand / Joseph Trigg / Mark Washington\", \"Grand Rapids mayor / police chief / city manager. [7,35]\"], [\"Gretchen Whitmer / Kaylie Hanson\", \"Michigan governor / spokesperson who confirmed the review. [8]\"], [\"Johan Sebastián Durán Guerrero / Martha Karolina Rojas Alvarez\", \"Biddeford victim / his partner. [11]\"], [\"Benjamin Gideon / Sean P. Murphy\", \"Lawyers for the Maine family. [11,14]\"], [\"Aaron Frey\", \"Maine attorney general. [13]\"], [\"Oscar Belgal / Jessica Tisch\", \"Man wounded in Manhattan / NYPD commissioner who described the evidence. [15,16]\"], [\"Markwayne Mullin / Marcos Charles\", \"DHS secretary / ICE enforcement official who gave the federal account. [15]\"], [\"Miguel Parra-Hernandez / Kim Bruno\", \"Injured construction worker / his lawyer. [19]\"], [\"Sean Teare / Ed Gonzalez / Abbie Kamin\", \"Harris County district attorney / sheriff / county attorney. These are distinct offices. [22]\"], [\"Jose Mendoza-Cervantes / Jose Hector Jimenez Mendoza\", \"ICE’s target name / identity supplied by the pictured man’s family; alias relationship reported, not independently verified here. [37]\"], [\"Jamie Jimenez / Jazmine Ulloa\", \"Daughter who identified the photograph / New York Times reporter who described document checks. [37]\"], [\"Angelina Godoy / Bob Ferguson\", \"UW Center for Human Rights director / Washington governor. [29]\"], [\"Nathaniel A. Muniz-Spry\", \"Man wounded in the Blaine encounter; federal defendant in the June announcement. [30]\"]]}", "## Washington reader resources", "Washington Immigrant Solidarity Network: text 1-844-724-3737. The current hotline page lists Monday–Friday, 7 a.m.–2 p.m.; it is not advertised there as a 24-hour service. Check the linked page for changes. [32]", "Washington Attorney General: guidance describes the right to record officials working in public, subject to restrictions including trespass and lawful orders. Keep clear of the operation. Preserve original files and consult the full guidance rather than relying on a one-sentence legal summary. [33]", "## Method and limits", "Reporting method: This is a sourced magazine rewrite and analysis of published reporting, official statements and research. It includes no new interviews, field visits, independently obtained crash file or independently transcribed 911 recording. Quotations and reconstructed details are attributed accordingly.", "Timing: Michigan clock references are local morning times as reported; September 20 falls within Eastern daylight time. No absolute second is invented. The reported 49-second interval is not converted into 7:08:49 because the underlying impact second is unavailable. Early approximate crash reports and later surveillance references should not be treated as independently synchronized clocks.", "Status: An investigation, an internal review, administrative leave and a criminal charge are different procedural events. No final finding on the legality of the Grand Rapids encounter was verified for this report. Lack of a public finding is not proof of either innocence or wrongdoing.", "Scope: The national examples are selected comparisons, not a complete incident database. No claim is made that all deaths or shootings have been enumerated. Counts from different periods, agencies and inclusion rules are not added together.", "Source access: Several official or news pages were available only through indexed text; those entries are labeled. A syndicated version is not independent corroboration of its original. The primary UW report controls the date range where its news summary differs.", "#T {\"title\": \"Sources and record notes\", \"head\": [\"#\", \"Source\", \"Note\"], \"rows\": [[\"[1]\", \"Michigan Public — Lindsey Smith. Listen to ICE agent’s 911 call in fatal Grand Rapids crash. October 14, 2026.\", \"Published excerpts and link to the released recording. The recording was not independently transcribed for this report.\"], [\"[2]\", \"WOOD-TV / AOL — Katherine Connolly. Police report: ICE called 911 seconds after deadly crash. October 15, 2026.\", \"Reporter’s review of GRPD reports; the underlying files and clock synchronization were not independently inspected.\"], [\"[3]\", \"FOX 17 — Sam Landstra. DHS: Man who died in car crash after fleeing ICE wasn’t target of traffic stop. September 24, 2026.\", \"DHS account, explicitly distinguished from investigative findings.\"], [\"[4]\", \"FOX 17 — Sam Landstra. Wife remembers husband killed in car crash after attempted traffic stop by ICE. September 2026.\", \"Family interview through translation; reports age 36 and wife’s name as Masadonia.\"], [\"[5]\", \"WOOD-TV / AOL — Susan Samples. A Bible and teddy bears: Inside the home of an undocumented worker who died fleeing ICE. Updated September 29, 2026.\", \"Original local reporting on belongings, work, soccer and family plans. No claim of a visit by this paper.\"], [\"[6]\", \"Michigan Public — Dustin Dwyer and Michelle Jokisch Polo. Community holds vigil for man who died in crash following ICE stop. September 25, 2026.\", \"Vigil reporting, family representative and DHS response.\"], [\"[7]\", \"City of Grand Rapids. Mayor David LaGrand statement on the September 20 death of Mario David Coronado Juarez. September 24, 2026.\", \"Primary statement; mayoral judgment is not a crash-investigation finding.\"], [\"[8]\", \"Michigan Advance — Emma J Nelson. Whitmer directs MSP to investigate fatal crash following ICE pursuit in Grand Rapids. September 23, 2026.\", \"Governor’s spokesperson Kaylie Hanson confirms the independent review.\"], [\"[9]\", \"Representative Hillary Scholten / PublicNow reproduction. Congresswoman Scholten Demands Answers from ICE after Fatal Car Crash in Grand Rapids. September 22, 2026.\", \"Indexed full text of the congressional letter and thirteen questions; direct page retrieval was unavailable.\"], [\"[10]\", \"8 C.F.R. § 287.8 — Cornell Legal Information Institute. Standards for enforcement activities. Current text accessed October 18, 2026.\", \"Text of the regulation, including (b)(2), (c) and (e). General framework, not an adjudication of this incident.\"], [\"[11]\", \"Maine Public — Ari Snider and Nicole Ogrysko. Partner of Biddeford man killed by ICE says he was a loving partner and devoted father. July 16, 2026.\", \"Family press conference; counsel’s account of work authorization and immigration process.\"], [\"[12]\", \"Maine Office of the Attorney General. Federal Law Enforcement Fatal Use of Deadly Force in Biddeford, Maine, July 13, 2026. July 13, 2026.\", \"Primary initial announcement. Its account of the vehicle’s direction is explicitly preliminary.\"], [\"[13]\", \"Maine Office of the Attorney General. Statement of Attorney General Aaron M. Frey prompted by the shadow hearing. August 17, 2026.\", \"Primary statement of investigative status, legal scope and contemplated review-panel referral.\"], [\"[14]\", \"The Boston Globe. An ICE agent shot and killed her partner in Maine. Now, she wants justice.. September 24, 2026.\", \"Family interview and counsel’s evidence account.\"], [\"[15]\", \"ABC News — Aaron Katersky and colleagues. New surveillance footage shows ICE confrontation in NYC street before shooting. October 9, 2026.\", \"Public footage’s limitations, DHS response and camera statement.\"], [\"[16]\", \"WABC / ABC7 New York. ICE officer shoots man in vehicle in Marble Hill, Manhattan. October 8, 2026.\", \"NYPD account of the shooting, seven discharges and the child’s condition.\"], [\"[17]\", \"Houston Chronicle — Daniella Jiménez and John Wayne Ferguson. Video shows ICE agent’s pursuit of man through Houston parking lot that ended with broken leg. October 10, 2026.\", \"Contemporaneous sheriff’s timing and initial ICE account.\"], [\"[18]\", \"Associated Press. Texas prosecutor says ICE officer appeared to intentionally strike a man with a vehicle in Houston. October 2026.\", \"Interview with Sean Teare; allegations, contemplated charges and ICE denial.\"], [\"[19]\", \"KPRC — Brittany Taylor. Was ICE chasing a dead man? New report raises alarming questions about Houston operation. October 15; updated October 16, 2026.\", \"Local follow-up on identity, injuries and disputed evidence handling; partly attributes reporting to the New York Times.\"], [\"[20]\", \"Associated Press — Lekan Oyekanmi, Jack Brook and Valerie Gonzalez. ICE pursuit in Houston that broke a man’s leg targeted a suspect who died years ago, family says. October 16, 2026.\", \"District attorney’s spokesperson and family/FIEL accounts; no independent death-certificate inspection here.\"], [\"[21]\", \"ABC News. ICE officer who allegedly struck man in Texas with vehicle placed on administrative leave, agency says. October 16, 2026.\", \"ICE confirmation of leave and internal investigation.\"], [\"[22]\", \"Harris County Attorney Abbie Kamin. Statement on incident involving ICE in Harris County. October 10, 2026.\", \"Primary statement supporting sheriff and district attorney investigations.\"], [\"[23]\", \"ABC News — Laura Romero, Bill Hutchinson and Ely Brown. Federal immigration agents have shot at least 21 people during Trump’s second term. September 24, 2026.\", \"A dated media count with defined categories; not a live census.\"], [\"[24]\", \"JAMA — Sanjay Basu and colleagues. Mortality in US Immigration and Customs Enforcement Detention. 2026; study cutoff January 19, 2026.\", \"Primary research. Fiscal-year periods, exposure denominators, annualization and confidence intervals matter.\"], [\"[25]\", \"UCLA Law Behind Bars Data Project. ICE Deaths in Custody. Dashboard updated October 2026; displayed records through September 18.\", \"Primary data project with inclusion rules. The feature does not invent a current 2026 total from its charts.\"], [\"[26]\", \"Human Rights Watch and Physicians for Human Rights. Dying in Detention: Rising Deaths in an Expanding US Immigration Detention System. June 25, 2026.\", \"Original analysis and case review; broader categories are not interchangeable with UCLA’s facility count.\"], [\"[27]\", \"U.S. Government Accountability Office. GAO-26-108157: CBP and ICE Should Improve Body-Worn Camera Program Management. Dated September 15; publicly released October 14, 2026.\", \"Primary audit, including agency response.\"], [\"[28]\", \"University of Washington Center for Human Rights. Stopping the DMV-to-DHS Data Pipeline. October 13, 2026.\", \"Primary records-based research. The 356-incident interval begins in August 2025, not January 2026.\"], [\"[29]\", \"KUOW — Gustavo Sagrero Álvarez. New UW report shows how feds gather WA driver data to make ICE arrests. October 16, 2026.\", \"Governor’s response and local context. Use the primary report for the arrest-count date range.\"], [\"[30]\", \"U.S. Attorney’s Office, Western District of Washington. Repeat offender charged with being a felon in possession of a firearm. June 17, 2026.\", \"Primary charging announcement on Nathaniel A. Muniz-Spry. Allegations are not a ruling on use of force.\"], [\"[31]\", \"Washington Attorney General. Governor Ferguson, Attorney General Brown seek court order to permit health inspections at Northwest ICE Processing Center. April 28, 2026.\", \"Primary announcement retrieved in indexed text; direct page retrieval was unavailable.\"], [\"[32]\", \"Washington Immigrant Solidarity Network. Deportation Defense Hotline. Accessed October 18, 2026.\", \"Current page emphasizes texting; hours shown as Monday–Friday, 7 a.m.–2 p.m. Older listings differ.\"], [\"[33]\", \"Washington Attorney General. Know Your Rights: Witnessing Immigration Enforcement Activity. Accessed October 18, 2026.\", \"Official guidance retrieved in indexed text; direct page retrieval was unavailable.\"], [\"[34]\", \"Michigan Advance — Emma J Nelson. Grand Rapids community demands answers after Guatemalan man dies fleeing attempted ICE stop. September 25, 2026.\", \"Vigil and letter deadline; reports age 35, differing from some local coverage.\"], [\"[35]\", \"WOOD-TV / AOL — Rachel Van Gilder. Feds: ICE wasn’t chasing man who fled stop before crash. Updated September 25, 2026.\", \"DHS response, police statement and wife’s interview through a translator.\"], [\"[36]\", \"Associated Press. ICE will no longer report deaths of detainees who have recently been released from custody. June 5, 2026.\", \"Retrieved indexed report of the reporting-policy change; full page was unavailable.\"], [\"[37]\", \"FOX 26 / AOL — Karys Belger. NYT reporter explains records behind questions about ICE target photo in Houston operation. Updated October 17, 2026 UTC.\", \"Interview with reporter Jazmine Ulloa; documents reviewed by the Times and limits of alias verification.\"]], \"note\": \"Links to every source are in the box below.\"}"], "sources": [{"outlet": "[1] Michigan Public — Lindsey Smith", "title": "Listen to ICE agent’s 911 call in fatal Grand Rapids crash", "date": "October 14, 2026", "url": "https://www.michiganpublic.org/public-safety/2026-10-14/listen-to-ice-agents-911-call-in-fatal-grand-rapids-crash"}, {"outlet": "[2] WOOD-TV / AOL — Katherine Connolly", "title": "Police report: ICE called 911 seconds after deadly crash", "date": "October 15, 2026", "url": "https://www.aol.com/articles/police-report-ice-called-911-182605000.html"}, {"outlet": "[3] FOX 17 — Sam Landstra", "title": "DHS: Man who died in car crash after fleeing ICE wasn’t target of traffic stop", "date": "September 24, 2026", "url": "https://www.fox17online.com/news/local-news/grand-rapids/dhs-man-who-died-in-car-crash-after-fleeing-ice-wasnt-target-of-traffic-stop"}, {"outlet": "[4] FOX 17 — Sam Landstra", "title": "Wife remembers husband killed in car crash after attempted traffic stop by ICE", "date": "September 2026", "url": "https://www.fox17online.com/news/local-news/grand-rapids/he-was-a-good-father-wife-remembers-husband-killed-in-car-crash-after-attempted-traffic-stop-by-ice"}, {"outlet": "[5] WOOD-TV / AOL — Susan Samples", "title": "A Bible and teddy bears: Inside the home of an undocumented worker who died fleeing ICE", "date": "Updated September 29, 2026", "url": "https://www.aol.com/articles/bible-teddy-bears-inside-home-002217000.html"}, {"outlet": "[6] Michigan Public — Dustin Dwyer and Michelle Jokisch Polo", "title": "Community holds vigil for man who died in crash following ICE stop", "date": "September 25, 2026", "url": "https://www.michiganpublic.org/community/2026-09-25/community-holds-vigil-for-man-who-died-in-crash-following-ice-stop"}, {"outlet": "[7] City of Grand Rapids", "title": "Mayor David LaGrand statement on the September 20 death of Mario David Coronado Juarez", "date": "September 24, 2026", "url": "https://www.grandrapidsmi.gov/city-news/posts/mayor-david-l laced on administrative leave, agency says", "date": "October 16, 2026", "url": "https://abcnews.com/US/ice-officer-allegedly-struck-man-texas-vehicle-administrative/story?id=137295824"}, {"outlet": "[22] Harris County Attorney Abbie Kamin", "title": "Statement on incident involving ICE in Harris County", "date": "October 10, 2026", "url": "https://cao.harriscountytx.gov/Connect/Newsroom/statement-from-harris-county-attorney-abbie-kamin-on-incident-involving-ice-in-harris-county"}, {"outlet": "[23] ABC News — Laura Romero, Bill Hutchinson and Ely Brown", "title": "Federal immigration agents have shot at least 21 people during Trump’s second term", "date": "September 24, 2026", "url": "https://abcnews.com/Politics/federal-immigration-agents-shot-21-people-trumps-2nd/story?id=136692795"}, {"outlet": "[24] JAMA — Sanjay Basu and colleagues", "title": "Mortality in US Immigration and Customs Enforcement Detention", "date": "2026; study cutoff January 19, 2026", "url": "https://jamanetwork.com/journals/jama/fullarticle/2847650"}, {"outlet": "[25] UCLA Law Behind Bars Data Project", "title": "ICE Deaths in Custody", "date": "Dashboard updated October 2026; displayed records through September 18", "url": "https://uclaprisondata.org/ice-deaths-in-custody"}, {"outlet": "[26] Human Rights Watch and Physicians for Human Rights", "title": "Dying in Detention: Rising Deaths in an Expanding US Immigration Detention System", "date": "June 25, 2026", "url": "https://www.hrw.org/report/2026/06/25/dying-in-detention/rising-deaths-in-an-expanding-us-immigration-detention-system"}, {"outlet": "[27] U.S. Government Accountability Office", "title": "GAO-26-108157: CBP and ICE Should Improve Body-Worn Camera Program Management", "date": "Dated September 15; publicly released October 14, 2026", "url": "https://files.gao.gov/reports/GAO-26-108157/index.html"}, {"outlet": "[28] University of Washington Center for Human Rights", "title": "Stopping the DMV-to-DHS Data Pipeline", "date": "Octob
