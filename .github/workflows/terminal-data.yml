name: Terminal data refresh

on:
  schedule:
    - cron: '40 12 * * 1-5'   # ~8:40 ET pre-market
    - cron: '35 21 * * 1-5'   # ~5:35 ET after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market data
        env:
          GWT_CACHE_HOURS: ${{ github.event.schedule == '40 12 * * 1-5' && '20' || '0.5' }}
        run: |
          mkdir -p .gwt-out
          cp terminal/data.json .gwt-out/ && cp -r terminal/hist .gwt-out/
          python3 tools/gwt/fetch_data.py .gwt-out
          python3 -c "import json;d=json.load(open('.gwt-out/data.json'));assert d"
          cp .gwt-out/data.json terminal/data.json
          cp .gwt-out/hist/*.json terminal/hist/
      - name: Commit data
        run: |
          git config user.name "terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/data.json terminal/hist
          git diff --cached --quiet && exit 0
          git commit -m "Refresh terminal data"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
