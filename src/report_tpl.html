<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Guitar Doug Report</title>
<meta name="description" content="The Guitar Doug Report — Seattle news, culture, crime, music and the stories nobody else will run.">
<meta property="og:title" content="The Guitar Doug Report">
<meta property="og:image" content="https://seattlesinner.com/report/masthead.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121212; --ink2:#363636; --mute:#5a5a5a; --faint:#727272;
  --rule:#dfdfdf; --rule-dk:#121212; --bg:#ffffff; --link:#326891; --red:#a3121b;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin','Franklin Gothic Medium',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{color:#3d3d3d}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* top strip */
.strip{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--sans);font-size:12px;padding:14px 0 6px;gap:12px}
.strip .l{font-weight:700;line-height:1.4}
.strip .l span{display:block;font-weight:400;color:var(--mute)}
.strip .r{text-align:right;color:var(--ink2);line-height:1.4}
.strip .r b{font-weight:700;color:var(--ink)}
.mast{display:block;text-align:center;padding:4px 0 10px}
.mast img{width:min(620px,100%);height:auto;display:inline-block}
.ed{font-family:var(--sans);font-size:11px;text-align:center;color:var(--mute);letter-spacing:.02em;margin:-2px 0 10px}

/* nav */
nav.sec{border-top:1px solid var(--rule-dk);border-bottom:1px solid var(--rule-dk);margin-bottom:3px}
nav.sec ul{list-style:none;margin:0;padding:9px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;font-family:var(--sans);font-size:13px}
nav.sec a:hover{text-decoration:underline}
nav.sec a.on{font-weight:700}
.dbl{border-top:1px solid var(--rule-dk);margin-bottom:18px}

/* labels */
.kick{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.kick.red{color:var(--red)}
.meta{font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:8px;letter-spacing:.01em}
.hl{font-family:var(--serif);font-weight:700;letter-spacing:-.005em;margin:0;line-height:1.15}
.dek{font-family:var(--serif);color:var(--ink2);font-size:15px;line-height:1.45;margin:7px 0 0}

/* front page grid */
.front{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1.25fr) minmax(0,1fr);gap:0}
.front>.col{padding:0 18px}
.front>.col:first-child{padding-left:0}
.front>.col:last-child{padding-right:0}
.front>.col+.col{border-left:1px solid var(--rule)}
.story{display:block;padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid var(--rule)}
.story:last-child{border-bottom:0;margin-bottom:0}
.lead h2.hl{font-size:clamp(28px,3.2vw,38px);line-height:1.08;font-weight:700}
.lead .dek{font-size:17px}
.lead ul{margin:12px 0 0;padding:0;list-style:none;font-family:var(--serif);font-size:15px}
.lead li .hl{font-size:16px;font-weight:600;line-height:1.3}
.lead li{padding:7px 0 0 14px;position:relative;line-height:1.35;font-weight:600}
.lead li:before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;background:var(--ink)}
.mid .hl{font-size:22px}
.sm .hl{font-size:18px}
.xs .hl{font-size:16px;font-weight:600}
.fig{margin:0 0 10px}
.fig img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;background:#eee}
.fig figcaption{font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:5px;text-align:right}

/* right rail */
.rail h3{font-family:var(--sans);font-size:13px;font-weight:800;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.rail h3 small{font-weight:400;font-size:11px;color:var(--faint)}
.rail .box{margin-bottom:26px}
.cw{display:block;padding:0 0 10px;margin:0 0 10px;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.cw .hl{font-size:15px;font-weight:600;line-height:1.25}
.cw .meta{margin-top:4px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.3}
.ev:last-child{border-bottom:0}
.ev .t{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--mute);padding-top:2px}
.ev b{font-weight:600}
.ev span{display:block;font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:2px}
.empty{font-family:var(--sans);font-size:12px;color:var(--faint)}

/* section bands */
.band{margin-top:34px;border-top:1px solid var(--rule-dk);padding-top:8px}
.band>h2{font-family:var(--sans);font-size:14px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:6px}
.band>h2 a:hover{text-decoration:underline}
.band>h2:after{content:"›";font-weight:400;font-size:18px;line-height:1}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.four>a{padding:0 16px}
.four>a:first-child{padding-left:0}
.four>a:last-child{padding-right:0}
.four>a+a{border-left:1px solid var(--rule)}
.four .hl{font-size:18px}
.four .dek{font-size:14px}

/* section index */
.secidx h1{font-family:var(--serif);font-size:40px;font-weight:700;margin:10px 0 4px}
.secidx .sub{font-family:var(--sans);font-size:13px;color:var(--mute);margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--rule-dk)}
.row{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--rule)}
.row .d{font-family:var(--sans);font-size:12px;color:var(--faint);padding-top:4px}
.row .hl{font-size:22px}
.secidx{max-width:840px}

/* article */
.art{max-width:640px;margin:26px auto 0}
.art .kick{margin-bottom:12px}
.art h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,4.4vw,44px);line-height:1.1;letter-spacing:-.01em;margin:0}
.art .sumry{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink2);margin:14px 0 22px}
.byline{font-family:var(--sans);font-size:14px;font-weight:600;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.byline time{font-weight:400;font-size:12px;color:var(--mute);display:block;margin-top:2px}
.share{display:flex;gap:8px}
.share button{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--rule);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.share button:hover{border-color:var(--ink)}
.art video{width:100%;margin:22px 0 4px;background:#000;display:block}
.cap{font-family:var(--sans);font-size:12px;color:var(--mute)}
.body{font-family:var(--serif);font-size:20px;line-height:1.6;color:#222;margin-top:24px}
.body p{margin:0 0 22px}
.body h2{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.25;margin:36px 0 12px;color:var(--ink)}
.body blockquote{margin:30px 0;padding:0 0 0 18px;border-left:3px solid var(--ink);font-size:24px;line-height:1.35;font-style:italic;color:var(--ink)}
.srcs{margin-top:34px;padding-top:12px;border-top:1px solid var(--rule-dk)}
.srcs h4{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.srcs ol{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink2);padding-left:20px;margin:0}
.srcs a{color:var(--link)}
.srcs a:hover{text-decoration:underline}
.more{margin-top:46px}

footer{margin-top:50px;border-top:1px solid var(--rule-dk);padding:18px 0 40px;font-family:var(--sans);font-size:12px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer img{height:22px;width:auto}
footer a:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--sans);font-size:13px;padding:9px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:980px){
  .front{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .front>.col.rail{grid-column:1/-1;border-left:0;padding:22px 0 0;margin-top:18px;border-top:1px solid var(--rule-dk);display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .front>.col.mid{padding-right:0}
  .four{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}
  .four>a:nth-child(3){padding-left:0;border-left:0}
  .four>a:nth-child(2){padding-right:0}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .strip .r .wx{display:none}
  .front{grid-template-columns:1fr}
  .front>.col{padding:0!important;border-left:0!important}
  .front>.col.mid{margin-top:16px;padding-top:16px!important;border-top:1px solid var(--rule)!important}
  .front>.col.rail{grid-template-columns:1fr}
  .four{grid-template-columns:1fr}
  .four>a{padding:0 0 14px!important;border-left:0!important;border-bottom:1px solid var(--rule)}
  .four>a:last-child{border-bottom:0}
  nav.sec ul{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;gap:18px;padding:9px 2px;scrollbar-width:none}
  nav.sec ul::-webkit-scrollbar{display:none}
  nav.sec li{white-space:nowrap}
  .row{grid-template-columns:1fr;gap:4px}
  .body{font-size:18px}
  .art .sumry{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip">
    <div class="l" id="today"></div>
    <div class="r"><span class="wx" id="wx"></span></div>
  </div>
  <a class="mast" href="./" aria-label="The Guitar Doug Report home"><img src="masthead.png" alt="The Guitar Doug Report" width="1400" height="286"></a>
  <nav class="sec"><ul id="nav"></ul></nav>
  <div class="dbl"></div>
  <main id="main"></main>
  <footer>
    <div><img src="masthead.png" alt="The Guitar Doug Report"></div>
    <div>© <span id="yr"></span> The Guitar Doug Report · Seattle · <a href="https://newspacesocialmedia.com">Talk back on Newspace</a></div>
  </footer>
</div>
<div class="toast" id="toast"></div>
<script>
const STORIES=/*STORIES*/[];
const SECTIONS=[["streets","Streets"],["politics","Politics"],["national","National"],["surveillance","Surveillance"],["tech","Tech"],["culture","Culture"],["music","Music"],["screen","Screen"],["nightlife","Nightlife"],["ink","Ink"]];
const SNAME=Object.fromEntries(SECTIONS);
const POSTER={"you-can-see-everything":["../img/you-can-see-everything.jpg","A24"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString("en-US",o||{month:"short",day:"numeric",year:"numeric"});
const url=(k,v)=>"?"+k+"="+encodeURIComponent(v);
const BY="Guitar Doug";

const sorted=STORIES.map((s,i)=>({...s,_i:i})).sort((a,b)=>b.date.localeCompare(a.date)||a._i-b._i);
const P=new URLSearchParams(location.search);

/* chrome */
(function(){
  const now=new Date();
  $("#today").innerHTML=esc(now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}))+"<span>Seattle Edition</span>";
  $("#yr").textContent=now.getFullYear();
  const cur=P.get("section")||(P.get("story")&&(STORIES.find(s=>s.slug===P.get("story"))||{}).topic);
  const present=new Set(STORIES.map(s=>s.topic));
  $("#nav").innerHTML='<li><a href="./" class="'+(!P.toString()?"on":"")+'">Front Page</a></li>'+
    SECTIONS.filter(([k])=>present.has(k)).map(([k,n])=>'<li><a href="'+url("section",k)+'" class="'+(cur===k?"on":"")+'">'+n+'</a></li>').join("")+
    '<li><a href="./#crime">Crime Watch</a></li><li><a href="./#tonight">Tonight</a></li>';
  fetch("https://api.open-meteo.com/v1/forecast?latitude=47.6062&longitude=-122.3321&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=1")
   .then(r=>r.json()).then(w=>{
     const c=w.current.weather_code,t=Math.round(w.current.temperature_2m);
     const word=c===0?"Clear":c<=3?"Cloudy":c<=48?"Fog":c<=67?"Rain":c<=77?"Snow":c<=82?"Showers":"Storms";
     $("#wx").innerHTML="<b>"+t+"°F</b> "+word+" · H "+Math.round(w.daily.temperature_2m_max[0])+"° L "+Math.round(w.daily.temperature_2m_min[0])+"°<br>Seattle";
   }).catch(()=>{});
})();

const meta=s=>'<div class="meta">'+s.minutes+' min read</div>';
const card=(s,cls,opts={})=>{
  const pic=opts.pic&&POSTER[s.slug];
  return '<a class="story '+cls+'" href="'+url("story",s.slug)+'">'+
   (pic?'<figure class="fig"><img src="'+pic[0]+'" alt="" loading="lazy"><figcaption>'+esc(pic[1])+'</figcaption></figure>':'')+
   (opts.kick?'<div class="kick'+(opts.red?" red":"")+'">'+esc(SNAME[s.topic]||s.topic)+'</div>':'')+
   '<h3 class="hl">'+esc(s.title)+'</h3>'+(opts.dek===false?'':'<p class="dek">'+esc(s.dek)+'</p>')+meta(s)+'</a>';
};

function front(){
  document.title="The Guitar Doug Report";
  const news=sorted.filter(s=>s.topic!=="ink");
  const used=new Set();
  const take=(f,n)=>{const out=[];for(const s of news){if(out.length>=n)break;if(!used.has(s.slug)&&(!f||f(s))){used.add(s.slug);out.push(s)}}return out};
  const lead=take(null,1)[0];
  const related=sorted.filter(s=>s.slug!==lead.slug&&s.topic===lead.topic).slice(0,3);
  related.forEach(s=>used.add(s.slug));
  const featured=take(s=>POSTER[s.slug],1);
  const colA=take(null,3), colB=take(null,4);
  let h='<div class="front"><div class="col">';
  h+='<div class="story lead"><a href="'+url("story",lead.slug)+'"><div class="kick red">'+esc(SNAME[lead.topic]||lead.topic)+'</div><h2 class="hl">'+esc(lead.title)+'</h2><p class="dek">'+esc(lead.dek)+'</p>'+meta(lead)+'</a>'+
     (related.length?'<ul>'+related.map(s=>'<li><a class="hl" href="'+url("story",s.slug)+'">'+esc(s.title)+'</a></li>').join("")+'</ul>':'')+'</div>';
  h+=colA.map(s=>card(s,"mid",{kick:1})).join("");
  h+='</div><div class="col mid">';
  h+=featured.map(s=>card(s,"mid",{pic:1,kick:1})).join("");
  h+=colB.map((s,i)=>card(s,i<2?"sm":"xs",{kick:1,dek:i<2})).join("");
  h+='</div><aside class="col rail">'+
     '<div class="box" id="crime"><h3>Crime Watch <small id="cwas"></small></h3><div id="cwl"><div class="empty">Loading the overnight log…</div></div></div>'+
     '<div class="box" id="tonight"><h3>Tonight in Seattle <small id="tnd"></small></h3><div id="tnl"><div class="empty">Loading listings…</div></div></div>'+
     '</aside></div>';
  // section bands with whatever hasn't run up top
  const bands=[["streets"],["politics","national"],["surveillance"],["tech"],["culture"],["music","nightlife","screen"],["ink"]];
  for(const ks of bands){
    const list=sorted.filter(s=>ks.includes(s.topic)&&!used.has(s.slug)).slice(0,4);
    if(!list.length)continue;
    list.forEach(s=>used.add(s.slug));
    const name=ks.map(k=>SNAME[k]).join(" & ");
    h+='<section class="band"><h2><a href="'+url("section",ks[0])+'">'+esc(name)+'</a></h2><div class="four">'+list.map(s=>'<a href="'+url("story",s.slug)+'"><h3 class="hl">'+esc(s.title)+'</h3><p class="dek">'+esc(s.dek)+'</p>'+meta(s)+'</a>').join("")+'</div></section>';
  }
  $("#main").innerHTML=h;
  loadRail();
}

function loadRail(){
  fetch("../data/crime.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
    const it=(d.items||[]).slice(0,6);
    if(d.asof)$("#cwas").textContent="Updated "+new Date(d.asof).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    $("#cwl").innerHTML=it.length?it.map(x=>'<a class="cw" href="'+esc(x.url)+'" target="_blank" rel="noopener"><div class="hl">'+esc(x.headline)+'</div><div class="meta">'+esc([x.hood,x.outlet].filter(Boolean).join(" · "))+'</div></a>').join(""):'<div class="empty">Quiet night.</div>';
  }).catch(()=>{$("#cwl").innerHTML='<div class="empty">Log unavailable right now.</div>'});
  fetch("../data/cal.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
    const today=new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});
    let ev=(d.events||[]).filter(e=>e.date>=today).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
    const day=ev.length?ev[0].date:today;
    ev=ev.filter(e=>e.date===day).slice(0,9);
    $("#tnd").textContent=day===today?"":fmtDate(day,{weekday:"short",month:"short",day:"numeric"});
    if(day!==today)$("#tonight h3").firstChild.textContent="Next Up in Seattle ";
    $("#tnl").innerHTML=ev.length?ev.map(e=>'<a class="ev" href="'+esc(e.url||"#")+'" target="_blank" rel="noopener"><div class="t">'+esc(e.time||"TBA")+'</div><div><b>'+esc(e.artists)+'</b><span>'+esc([e.venue,e.hood].filter(Boolean).join(" · "))+'</span></div></a>').join(""):'<div class="empty">No listings yet.</div>';
  }).catch(()=>{$("#tnl").innerHTML='<div class="empty">Listings unavailable right now.</div>'});
}

function section(k){
  const name=SNAME[k]||k;
  document.title=name+" — The Guitar Doug Report";
  const list=sorted.filter(s=>s.topic===k);
  $("#main").innerHTML='<div class="secidx"><h1>'+esc(name)+'</h1><div class="sub">'+list.length+' '+(list.length===1?"story":"stories")+'</div>'+
    list.map(s=>'<a class="row" href="'+url("story",s.slug)+'"><div class="d">'+fmtDate(s.date)+'</div><div><h2 class="hl">'+esc(s.title)+'</h2><p class="dek">'+esc(s.dek)+'</p><div class="meta">By '+BY+' · '+s.minutes+' min read</div></div></a>').join("")+'</div>';
}

function article(slug){
  const s=STORIES.find(x=>x.slug===slug);
  if(!s){front();return}
  document.title=s.title+" — The Guitar Doug Report";
  const body=s.body.map(p=>p.startsWith("## ")?'<h2>'+esc(p.slice(3))+'</h2>':p.startsWith("> ")?'<blockquote>'+esc(p.slice(2))+'</blockquote>':'<p>'+esc(p)+'</p>').join("");
  const vid=(s.trailer||[]).map(t=>'<video controls preload="none" playsinline poster="../'+esc(t.poster)+'" src="../'+esc(t.src)+'"></video><div class="cap">'+esc(t.label)+(t.credit?" · "+esc(t.credit):"")+'</div>').join("");
  const src=(s.sources||[]).length?'<div class="srcs"><h4>Sources</h4><ol>'+s.sources.map(x=>'<li>'+esc(x.outlet)+(x.title?', “'+esc(x.title)+'”':"")+(x.date?" ("+esc(x.date)+")":"")+(x.url?' — <a href="'+esc(x.url)+'" target="_blank" rel="noopener">link</a>':"")+'</li>').join("")+'</ol></div>':"";
  const more=sorted.filter(x=>x.slug!==s.slug&&x.topic===s.topic).concat(sorted.filter(x=>x.topic!==s.topic&&x.topic!=="ink")).slice(0,4);
  $("#main").innerHTML='<article class="art"><div class="kick red"><a href="'+url("section",s.topic)+'">'+esc(SNAME[s.topic]||s.topic)+'</a></div><h1>'+esc(s.title)+'</h1><p class="sumry">'+esc(s.dek)+'</p>'+
    '<div class="byline"><div>By '+BY+'<time>'+fmtDate(s.date,{month:"long",day:"numeric",year:"numeric"})+' · '+s.minutes+' min read</time></div><div class="share"><button id="cp">Copy link</button><button id="xs">Share on X</button></div></div>'+
    vid+'<div class="body">'+body+'</div>'+src+'</article>'+
    '<section class="band more"><h2>More from The Guitar Doug Report</h2><div class="four">'+more.map(x=>'<a href="'+url("story",x.slug)+'"><div class="kick">'+esc(SNAME[x.topic]||x.topic)+'</div><h3 class="hl">'+esc(x.title)+'</h3>'+meta(x)+'</a>').join("")+'</div></section>';
  const link=location.origin+location.pathname+url("story",s.slug);
  $("#cp").onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast("Link copied")).catch(()=>prompt("Copy this link:",link))};
  $("#xs").onclick=()=>window.open("https://x.com/intent/post?text="+encodeURIComponent(s.title)+"&url="+encodeURIComponent(link),"_blank","noopener");
  window.scrollTo(0,0);
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}

if(P.get("story"))article(P.get("story"));
else if(P.get("section"))section(P.get("section"));
else front();
</script>
</body>
</html>
